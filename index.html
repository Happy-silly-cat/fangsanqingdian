<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="三国活动计算与实用工具合集。">
  <title>三国活动工具箱</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1110;
      --panel: #151b19;
      --panel-hover: #1b2421;
      --text: #f3f0e8;
      --muted: #a9b2ad;
      --line: #303a36;
      --jade: #5bc0a2;
      --jade-dark: #173f35;
      --gold: #e7bb61;
      --red: #d66a55;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    a {
      color: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 22px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border: 1px solid #557067;
      border-radius: 6px;
      background: #17342d;
      color: #f2d38e;
      font-family: STKaiti, KaiTi, serif;
      font-size: 25px;
      font-weight: 700;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-name {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
      font-weight: 750;
    }

    .brand-note {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .intro {
      padding: 52px 0 30px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--jade);
      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: 58px;
      line-height: 1.08;
      letter-spacing: 0;
      font-weight: 800;
    }

    .intro p:last-child {
      max-width: 620px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 14px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 19px;
      line-height: 1.3;
    }

    .section-heading span {
      color: var(--muted);
      font-size: 12px;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);
      gap: 14px;
    }

    .tool-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .tool-card.primary {
      display: block;
      min-height: 356px;
      text-decoration: none;
      isolation: isolate;
    }

    .tool-card.primary img {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 240ms ease;
    }

    .tool-card.primary::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: rgba(6, 11, 10, 0.18);
      pointer-events: none;
    }

    .tool-card.primary:hover {
      border-color: #65756f;
    }

    .tool-card.primary:hover img {
      transform: scale(1.015);
    }

    .card-copy {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      width: min(52%, 440px);
      min-height: 356px;
      padding: 30px;
      text-shadow: 0 2px 14px #050807;
    }

    .status {
      align-self: flex-start;
      margin-bottom: auto;
      border: 1px solid rgba(103, 206, 175, 0.65);
      border-radius: 999px;
      padding: 5px 10px;
      background: rgba(16, 56, 46, 0.84);
      color: #b9f1df;
      font-size: 12px;
      font-weight: 700;
      text-shadow: none;
    }

    .card-title {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 800;
    }

    .card-description {
      margin: 9px 0 19px;
      color: #d5ddd9;
      font-size: 14px;
      line-height: 1.65;
    }

    .card-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #fff1c7;
      font-size: 14px;
      font-weight: 700;
    }

    .coming-list {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 14px;
    }

    .coming-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
      padding: 22px;
      background: var(--panel);
    }

    .coming-card:hover {
      background: var(--panel-hover);
    }

    .coming-index {
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
    }

    .coming-card h3 {
      margin: 12px 0 6px;
      font-size: 18px;
      line-height: 1.35;
    }

    .coming-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .coming-label {
      align-self: flex-start;
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 5px 8px;
      color: #aeb8b3;
      font-size: 11px;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-top: 26px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    .visit-counter {
      display: flex;
      align-items: center;
      min-height: 24px;
    }

    .visit-counter img {
      display: block;
      max-width: 100%;
      height: 24px;
    }

    @media (max-width: 820px) {
      .intro {
        padding-top: 40px;
      }

      .tool-grid {
        grid-template-columns: 1fr;
      }

      .coming-list {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto;
      }

      .coming-card {
        min-height: 178px;
      }
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 24px, 1180px);
        padding-top: 18px;
      }

      .site-header {
        padding-bottom: 16px;
      }

      .intro {
        padding: 32px 0 24px;
      }

      h1 {
        font-size: 38px;
      }

      .section-heading {
        align-items: start;
        flex-direction: column;
        gap: 4px;
      }

      .tool-card.primary,
      .card-copy {
        min-height: 330px;
      }

      .tool-card.primary img {
        object-position: 58% center;
      }

      .tool-card.primary::after {
        background: rgba(6, 11, 10, 0.45);
      }

      .card-copy {
        width: 78%;
        padding: 22px;
      }

      .card-title {
        font-size: 26px;
      }

      .coming-list {
        grid-template-columns: 1fr;
      }

      footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .tool-card.primary img {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <div class="brand-mark" aria-hidden="true">策</div>
      <div class="brand-copy">
        <p class="brand-name">三国活动工具箱</p>
        <p class="brand-note">活动计算与实用查询</p>
      </div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">数据与工具</p>
      <h1 id="page-title">把活动账算明白</h1>
      <p>按活动选择工具，填写当前进度，即可计算资源需求与更合适的参与方案。</p>
    </section>

    <section aria-labelledby="tools-title">
      <div class="section-heading">
        <h2 id="tools-title">活动工具</h2>
        <span>现有 1 个可用工具</span>
      </div>

      <div class="tool-grid">
        <a class="tool-card primary" href="celebration.html">
          <img src="assets/celebration-banner.png" alt="灯火庆典中的星币、西瓜和奖励道具">
          <div class="card-copy">
            <span class="status">可用</span>
            <h2 class="card-title">庆典活动</h2>
            <p class="card-description">计算西瓜、字、星数奖励和刷新期望，找到满足目标所需的最低期望金币。</p>
            <span class="card-action">打开计算器 <span aria-hidden="true">&#8594;</span></span>
          </div>
        </a>

        <div class="coming-list" aria-label="后续功能入口">
          <article class="tool-card coming-card">
            <div>
              <span class="coming-index">入口 02</span>
              <h3>更多活动工具</h3>
              <p>新的活动计算功能会从这里继续加入。</p>
            </div>
            <span class="coming-label">待添加</span>
          </article>

          <article class="tool-card coming-card">
            <div>
              <span class="coming-index">入口 03</span>
              <h3>实用查询</h3>
              <p>为数据表、攻略和查询功能预留的入口。</p>
            </div>
            <span class="coming-label">待添加</span>
          </article>
        </div>
      </div>
    </section>

    <footer>
      <span>三国活动工具箱</span>
      <span class="visit-counter" id="visitCounter" aria-label="网页访问量"></span>
    </footer>
  </main>

  <script>
    const visitCounter = document.getElementById("visitCounter");

    if (window.location.hostname === "happy-silly-cat.github.io") {
      const counterImage = document.createElement("img");
      counterImage.src = "https://hitscounter.dev/api/hit?url=https%3A%2F%2Fhappy-silly-cat.github.io%2Ffangsanqingdian%2F&label=%E8%AE%BF%E9%97%AE%E9%87%8F&icon=github&color=%235bc0a2";
      counterImage.alt = "网页访问量";
      visitCounter.appendChild(counterImage);
    } else {
      visitCounter.textContent = "本地预览不计入访问量";
    }
  </script>
</body>
</html>
