<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="放三数据合集。">
  <title>放三数据合集</title>
  <link rel="icon" type="image/png" href="assets/fangsan-logo.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe5;
      --panel: #fff8ec;
      --panel-hover: #fff3dc;
      --text: #27231e;
      --muted: #746d62;
      --line: #d9cbb6;
      --jade: #5bc0a2;
      --jade-dark: #173f35;
      --gold: #e7bb61;
      --red: #d66a55;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    a {
      color: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 22px;
    }

    .brand-mark {
      display: block;
      width: 118px;
      height: auto;
      flex: 0 0 118px;
      object-fit: contain;
      filter: drop-shadow(0 5px 14px rgba(0, 0, 0, 0.34));
    }

    .brand-copy {
      min-width: 0;
      flex: 1 1 auto;
    }

    .brand-name {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
      font-weight: 750;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 28px;
    }

    .tool-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .tool-card.primary {
      display: block;
      min-height: 260px;
      text-decoration: none;
      isolation: isolate;
    }

    .card-picture,
    .card-picture img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .card-picture {
      z-index: -1;
      overflow: hidden;
    }

    .card-picture img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(1.06) saturate(1.06);
      transition: transform 240ms ease;
    }

    .tool-card.primary::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, rgba(6, 11, 10, 0.02), rgba(6, 11, 10, 0.2));
      pointer-events: none;
    }

    .tool-card.primary:hover {
      border-color: #65756f;
    }

    .tool-card.primary:hover .card-picture img,
    .tool-card.data-card:hover .card-picture img {
      transform: scale(1.015);
    }

    .tool-card.data-card {
      display: flex;
      min-height: 260px;
      padding: 0;
      text-decoration: none;
      isolation: isolate;
    }

    .tool-card.data-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, rgba(6, 11, 10, 0.08), rgba(6, 11, 10, 0.48));
      pointer-events: none;
    }

    .tool-card.data-card::after {
      content: "";
      position: absolute;
      right: 22px;
      top: 22px;
      z-index: -1;
      width: 142px;
      height: 90px;
      display: none;
      pointer-events: none;
    }

    .tool-card.data-card:hover {
      border-color: #65756f;
    }

    .card-copy {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      width: min(46%, 360px);
      min-height: 260px;
      margin-left: auto;
      padding: 26px;
      text-align: right;
      text-shadow: 0 2px 14px #050807;
    }

    .data-copy {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      width: min(46%, 360px);
      min-height: 260px;
      margin-left: auto;
      padding: 26px;
      text-align: right;
      text-shadow: 0 2px 14px #050807;
    }

    .card-title {
      margin: 0;
      color: #ffffff;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 800;
    }

    .card-description {
      margin: 9px 0 19px;
      color: #ffffff;
      font-size: 14px;
      line-height: 1.65;
    }

    .card-description .line {
      display: block;
    }

    .card-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
    }

    .data-card .card-title {
      color: #ffffff;
    }

    .data-card .card-description {
      color: #ffffff;
    }

    .data-card .card-action {
      color: #ffffff;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      margin-top: 26px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    .copyright-note {
      max-width: 760px;
      margin: 0;
      line-height: 1.7;
    }

    .visit-counter {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 24px;
      flex: 0 0 auto;
    }

    .visit-counter img {
      display: block;
      max-width: 100%;
      height: 24px;
    }

    @media (max-width: 820px) {
      .tool-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 24px, 1180px);
        padding-top: 18px;
      }

      .site-header {
        padding-bottom: 16px;
      }

      .brand-mark {
        width: 96px;
        flex-basis: 96px;
      }

      .tool-card.primary,
      .tool-card.data-card {
        aspect-ratio: 900 / 820;
        min-height: 0;
      }

      .card-picture img {
        object-fit: fill;
        object-position: center;
      }

      .tool-card.data-card .card-picture img {
        object-position: center;
      }

      .tool-card.primary::after {
        background: linear-gradient(90deg, rgba(6, 11, 10, 0.08), rgba(6, 11, 10, 0.34));
      }

      .card-copy,
      .data-copy {
        height: 100%;
        width: 78%;
        min-height: 100%;
        padding: 20px;
      }

      .tool-card.data-card {
        padding: 0;
      }

      .card-title {
        font-size: 26px;
      }

      .card-description {
        font-size: 13.5px;
        line-height: 1.55;
      }

      .card-description .line {
        white-space: nowrap;
      }

      footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .visit-counter {
        justify-content: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card-picture img {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <img class="brand-mark" src="assets/fangsan-logo.png" alt="放开那三国">
      <div class="brand-copy">
        <p class="brand-name">放三数据合集</p>
      </div>
    </header>

    <nav class="tool-grid" aria-label="功能入口">
        <a class="tool-card primary" href="celebration.html">
          <picture class="card-picture">
            <source media="(max-width: 560px)" srcset="assets/celebration-summer-mobile-v2.jpg">
            <img src="assets/celebration-summer-banner.png" alt="节日庆典背景">
          </picture>
          <div class="card-copy">
            <h2 class="card-title">节日庆典计算</h2>
            <p class="card-description"><span class="line">计算大/小材料购买方案</span><span class="line">并估算消耗金币数</span></p>
            <span class="card-action">打开计算器 <span aria-hidden="true">&#8594;</span></span>
          </div>
        </a>
        <a class="tool-card data-card" href="feature-unlock.html">
          <picture class="card-picture">
            <source media="(max-width: 560px)" srcset="assets/main-interface-night-mobile-v2.jpg">
            <img src="assets/main-interface-night-banner.jpg" alt="游戏主界面夜景背景">
          </picture>
          <div class="data-copy">
            <h2 class="card-title">等级解锁表</h2>
            <p class="card-description"><span class="line">查看等级开启玩法功能</span><span class="line">和对应提示文案</span></p>
            <span class="card-action">打开表格 <span aria-hidden="true">&#8594;</span></span>
          </div>
        </a>
    </nav>

    <footer>
      <p class="copyright-note">
        本站为玩家自制的学习交流工具，非官方页面，与游戏官方无关。页面中如使用了游戏内截图、图标或相关素材，仅用于非商业性资料整理与交流展示，相关素材版权归原权利方所有。如有侵权或不当使用，请联系删除。
      </p>
      <span class="visit-counter" id="visitCounter" aria-label="网页访问量"></span>
    </footer>
  </main>

  <script>
    const visitCounter = document.getElementById("visitCounter");

    if (window.location.hostname === "happy-silly-cat.github.io") {
      const counterImage = document.createElement("img");
      counterImage.src = "https://hitscounter.dev/api/hit?url=https%3A%2F%2Fhappy-silly-cat.github.io%2Ffangsanqingdian%2F&label=%E8%AE%BF%E9%97%AE%E9%87%8F&icon=github&color=%235bc0a2";
      counterImage.alt = "网页访问量";
      visitCounter.appendChild(counterImage);
    }
  </script>
</body>
</html>
