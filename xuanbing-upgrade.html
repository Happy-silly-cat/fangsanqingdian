<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="放三玄兵激活、进阶、升级材料与属性查询表。">
  <title>玄兵进阶与升级 - 放三数据合集</title>
  <link rel="icon" type="image/png" href="assets/fangsan-logo.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe5;
      --panel: #fff8ec;
      --panel-strong: #fffdf8;
      --panel-hover: #fff3dc;
      --text: #27231e;
      --muted: #746d62;
      --line: #d9cbb6;
      --jade: #3c9d85;
      --jade-dark: #173f35;
      --gold: #b8842f;
      --red: #a74e42;
      --purple: #64518f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    a { color: inherit; }
    select { font: inherit; }

    .shell {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 20px 0 32px;
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 52px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }

    .brand-mark {
      display: block;
      width: 118px;
      height: auto;
      flex: 0 0 118px;
      object-fit: contain;
      filter: drop-shadow(0 5px 14px rgba(0, 0, 0, 0.22));
    }

    .brand-copy { min-width: 0; flex: 1 1 auto; }

    .brand-name {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
      font-weight: 750;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .back-link:focus-visible,
    .field:focus-visible {
      outline: 2px solid rgba(60, 157, 133, 0.35);
      outline-offset: 2px;
      border-color: var(--jade);
    }

    .intro {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin: 14px 0 12px;
    }

    .page-title {
      margin: 0;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 850;
    }

    .page-note {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .picker-panel,
    .profile-panel,
    .summary-panel,
    .section-panel,
    .table-wrap {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .picker-panel {
      display: grid;
      grid-template-columns: 1fr 240px;
      gap: 14px;
      align-items: end;
      padding: 14px 16px;
    }

    .field-label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .field {
      width: 100%;
      min-height: 43px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
    }

    .profile-panel {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
      padding: 14px 16px;
    }

    .weapon-icon {
      display: grid;
      place-items: center;
      width: 70px;
      height: 70px;
      flex: 0 0 70px;
      border: 1px solid rgba(100, 81, 143, 0.34);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #d7c9ff, #8970c4 46%, #392d63 100%);
      box-shadow: inset 0 0 0 5px rgba(255, 255, 255, 0.18), 0 5px 15px rgba(57, 45, 99, 0.16);
      color: #ffffff;
      font-size: 26px;
      font-weight: 900;
      text-shadow: 0 2px 4px rgba(39, 28, 70, 0.65);
    }

    .weapon-icon img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: contain;
    }

    .profile-main { min-width: 0; flex: 1 1 auto; }

    .profile-heading {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .profile-name {
      margin: 0;
      color: var(--purple);
      font-size: 21px;
      line-height: 1.3;
      font-weight: 850;
    }

    .profile-quality {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .profile-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 18px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .profile-stats strong { color: var(--text); }

    .summary-panel,
    .section-panel {
      margin-top: 12px;
      padding: 14px 16px;
    }

    .summary-heading,
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .summary-heading {
      border-bottom: 1px solid rgba(217, 203, 182, 0.8);
      padding-bottom: 10px;
    }

    .summary-title,
    .section-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 850;
    }

    .summary-title { color: var(--jade-dark); }

    .section-meta,
    .summary-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .material-list,
    .attribute-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .material-list { margin-top: 11px; }

    .material-item,
    .attribute-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 34px;
      border: 1px solid rgba(60, 157, 133, 0.2);
      border-radius: 7px;
      background: var(--panel-strong);
      padding: 4px 8px 4px 5px;
      color: var(--jade-dark);
      font-size: 13px;
      white-space: nowrap;
    }

    .material-item img,
    .material-symbol {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      object-fit: contain;
    }

    .material-symbol {
      border-radius: 6px;
      background: linear-gradient(145deg, #a893d2, #564078);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
    }

    .material-item strong,
    .attribute-item strong { color: var(--text); font-weight: 800; }

    .attribute-list { margin-top: 11px; }

    .attribute-item {
      min-height: 31px;
      border-color: rgba(184, 132, 47, 0.25);
      color: var(--gold);
    }

    .table-section { margin-top: 16px; }

    .section-head { margin-bottom: 9px; }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      border-bottom: 1px solid rgba(217, 203, 182, 0.8);
      padding: 10px 13px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: rgba(231, 187, 97, 0.12);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--panel-hover); }

    .level-number {
      color: var(--gold);
      font-weight: 850;
      white-space: nowrap;
    }

    .level-gated {
      display: block;
      margin-top: 4px;
      color: var(--purple);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .attribute-item.compact {
      min-height: 29px;
      padding: 3px 8px;
    }

    .empty-cell { color: var(--muted); }

    footer {
      margin-top: 26px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    .copyright-note {
      max-width: 760px;
      margin: 0;
      line-height: 1.7;
    }

    @media (max-width: 720px) {
      .shell { width: min(100% - 24px, 1180px); padding-top: 16px; }
      .site-header { padding-bottom: 12px; }
      .brand-mark { width: 96px; flex-basis: 96px; }
      .intro { display: block; }
      .page-title { font-size: 25px; }
      .page-note { margin-top: 5px; }
      .picker-panel { grid-template-columns: 1fr; gap: 9px; }
      .profile-panel { align-items: flex-start; }
      .profile-stats { gap: 6px 14px; }
      .section-title { font-size: 17px; }
    }
  </style>
  <link rel="stylesheet" href="assets/table-attribute-standard.css?v=20260919">
  <script defer src="assets/table-attribute-standard.js"></script>
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <img class="brand-mark" src="assets/fangsan-logo.png" alt="放开那三国">
      <div class="brand-copy">
        <p class="brand-name">放三数据合集</p>
      </div>
      <a class="back-link" href="upgrade-materials.html">返回入口</a>
    </header>

    <section class="intro">
      <h1 class="page-title">玄兵进阶与升级</h1>
      <p class="page-note">查看玄兵激活、品质进阶、升级材料与属性变化</p>
    </section>

    <section class="picker-panel" aria-label="选择玄兵">
      <label class="field-label" for="weapon-select">
        选择玄兵
        <select class="field" id="weapon-select"></select>
      </label>
      <div class="field-label">
        查询范围
        <span class="field" id="range-label">完整进阶与升级</span>
      </div>
    </section>

    <section class="profile-panel" aria-live="polite">
      <div class="weapon-icon" id="weapon-icon" aria-hidden="true"></div>
      <div class="profile-main">
        <div class="profile-heading">
          <h2 class="profile-name" id="weapon-name"></h2>
          <span class="profile-quality" id="weapon-quality"></span>
        </div>
        <div class="profile-stats">
          <span>类型：<strong id="weapon-type"></strong></span>
          <span>激活：<strong id="activation-cost"></strong></span>
          <span>升级：<strong id="level-range"></strong></span>
        </div>
      </div>
    </section>

    <section class="summary-panel">
      <div class="summary-heading">
        <h2 class="summary-title">完整培养材料合计</h2>
        <span class="summary-meta">激活、进阶至 8 品质并升至 100 级</span>
      </div>
      <div class="material-list" id="total-materials"></div>
    </section>

    <section class="section-panel">
      <div class="section-head">
        <h2 class="section-title">基础属性</h2>
        <span class="section-meta">激活玄兵后获得</span>
      </div>
      <div class="attribute-list" id="base-attributes"></div>
    </section>

    <section class="section-panel">
      <div class="section-head">
        <h2 class="section-title">品质进阶</h2>
        <span class="section-meta">7 品质进阶至 8 品质</span>
      </div>
      <div class="material-list" id="quality-material"></div>
      <div class="attribute-list" id="quality-attributes"></div>
    </section>

    <section class="table-section">
      <div class="section-head">
        <h2 class="section-title">玄兵升级材料与属性</h2>
        <span class="section-meta">属性变化为该级新增值</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">升级等级</th>
              <th scope="col">消耗材料</th>
              <th scope="col">新增属性</th>
              <th scope="col">开放条件</th>
            </tr>
          </thead>
          <tbody id="upgrade-table"></tbody>
        </table>
      </div>
    </section>

    <footer>
      <p class="copyright-note">
        本站为玩家自制的学习交流工具，非官方页面，与游戏官方无关。页面中如使用了游戏内截图、图标或相关素材，仅用于非商业性资料整理与交流展示，相关素材版权归原权利方所有。如有侵权或不当使用，请联系删除。
      </p>
    </footer>
  </main>

  <script src="assets/xuanbing-data.js"></script>
  <script>
    (() => {
      const data = window.xuanbingData;
      const itemMap = data.items;
      const select = document.getElementById("weapon-select");
      const icon = document.getElementById("weapon-icon");
      const name = document.getElementById("weapon-name");
      const quality = document.getElementById("weapon-quality");
      const type = document.getElementById("weapon-type");
      const activationCost = document.getElementById("activation-cost");
      const levelRange = document.getElementById("level-range");
      const totalMaterialsEl = document.getElementById("total-materials");
      const baseAttributesEl = document.getElementById("base-attributes");
      const qualityMaterialEl = document.getElementById("quality-material");
      const qualityAttributesEl = document.getElementById("quality-attributes");
      const upgradeTable = document.getElementById("upgrade-table");

      const number = (value) => Number(value).toLocaleString("zh-CN");
      const text = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));

      function formatAttribute(attribute) {
        const value = attribute.percent ? attribute.value / 100 : attribute.value;
        return `${text(attribute.name)} +${number(value)}${attribute.percent ? "%" : ""}`;
      }

      function materialMarkup(material) {
        const item = itemMap[String(material.id)] || { name: `物品${material.id}`, icon: "" };
        const image = item.icon
          ? `<img src="${text(item.icon)}" alt="">`
          : `<span class="material-symbol" aria-hidden="true">${text(item.name.slice(0, 1))}</span>`;
        return `<span class="material-item">${image}<span>${text(item.name)} <strong>×${number(material.quantity)}</strong></span></span>`;
      }

      function attributesMarkup(attributes) {
        if (!attributes.length) return '<span class="empty-cell">—</span>';
        return `<div class="attribute-list">${attributes.map((attribute) => `<span class="attribute-item compact">${formatAttribute(attribute)}</span>`).join("")}</div>`;
      }

      function calculateTotalMaterials(weapon) {
        const totals = new Map();
        const add = (id, quantity) => totals.set(String(id), (totals.get(String(id)) || 0) + quantity);
        add(weapon.activation.id, weapon.activation.quantity);
        weapon.qualityAdvance && add(weapon.qualityAdvance.material.id, weapon.qualityAdvance.material.quantity);
        weapon.upgradeCosts.forEach((row) => row.materials.forEach((material) => add(material.id, material.quantity)));
        return [...totals].map(([id, quantity]) => ({ id, quantity }));
      }

      function render(weapon) {
        const weaponItem = itemMap[String(weapon.fragmentId)];
        icon.innerHTML = weaponItem && weaponItem.icon
          ? `<img src="${text(weaponItem.icon)}" alt="">`
          : text(weapon.name.slice(0, 1));
        name.textContent = weapon.name;
        quality.textContent = `${weapon.quality} 品质玄兵，进阶后 ${weapon.qualityAdvance.targetQuality} 品质`;
        type.textContent = weapon.type;
        activationCost.textContent = `${itemMap[String(weapon.activation.id)].name} ×${number(weapon.activation.quantity)}`;
        levelRange.textContent = `当前至${weapon.currentMaxLevel}级，进阶后至${weapon.maxLevel}级`;

        totalMaterialsEl.innerHTML = calculateTotalMaterials(weapon).map(materialMarkup).join("");
        baseAttributesEl.innerHTML = weapon.baseAttributes.map((attribute) => `<span class="attribute-item">${formatAttribute(attribute)}</span>`).join("");
        qualityMaterialEl.innerHTML = materialMarkup(weapon.qualityAdvance.material);
        qualityAttributesEl.innerHTML = weapon.qualityAdvance.attributes.map((attribute) => `<span class="attribute-item">${formatAttribute(attribute)}</span>`).join("");
        upgradeTable.innerHTML = weapon.upgradeCosts.map((row) => `
          <tr>
            <td class="level-number">${row.level}级${row.level > weapon.currentMaxLevel ? '<span class="level-gated">需 8 品质</span>' : ''}</td>
            <td><div class="material-list">${row.materials.map(materialMarkup).join("")}</div></td>
            <td>${attributesMarkup(row.attributes)}</td>
            <td>${row.level > weapon.currentMaxLevel ? '<span class="level-gated">品质进阶后</span>' : '<span class="empty-cell">7 品质可升级</span>'}</td>
          </tr>
        `).join("");
      }

      data.weapons.forEach((weapon, index) => {
        const option = document.createElement("option");
        option.value = String(weapon.id);
        option.textContent = weapon.name;
        if (index === 0) option.selected = true;
        select.appendChild(option);
      });

      select.addEventListener("change", () => {
        const weapon = data.weapons.find((item) => String(item.id) === select.value);
        if (weapon) render(weapon);
      });

      render(data.weapons[0]);
    })();
  </script>
</body>
</html>
