<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="放三战车属性与材料消耗表。">
  <title>战车 - 放三数据合集</title>
  <link rel="icon" type="image/png" href="assets/fangsan-logo.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe5;
      --panel: #fff8ec;
      --panel-soft: #fbf4e8;
      --panel-hover: #fff3dc;
      --text: #27231e;
      --muted: #746d62;
      --line: #d9cbb6;
      --jade: #3c9d85;
      --jade-soft: #e5f2ec;
      --gold: #a8782f;
      --shadow: 0 12px 26px rgba(69, 56, 39, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    a { color: inherit; }

    .shell {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 22px;
    }

    .brand-mark {
      display: block;
      width: 118px;
      height: auto;
      flex: 0 0 118px;
      object-fit: contain;
      filter: drop-shadow(0 5px 14px rgba(0, 0, 0, 0.22));
    }

    .brand-copy { min-width: 0; flex: 1 1 auto; }

    .brand-name {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
      font-weight: 750;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .page-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 26px 0 18px;
    }

    .page-title {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 850;
    }

    .page-meta {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      text-align: right;
    }

    .warcar-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .warcar-tab {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 13px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .warcar-tab:hover,
    .warcar-tab.is-active {
      transform: translateY(-2px);
      border-color: var(--jade);
      background: var(--jade-soft);
      box-shadow: var(--shadow);
    }

    .warcar-tab:focus-visible,
    .back-link:focus-visible {
      outline: 3px solid rgba(60, 157, 133, 0.4);
      outline-offset: 2px;
    }

    .warcar-tab img {
      display: block;
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      object-fit: contain;
      filter: drop-shadow(0 2px 3px rgba(50, 36, 20, 0.16));
    }

    .warcar-tab-copy { min-width: 0; }

    .warcar-tab-name {
      display: block;
      overflow-wrap: anywhere;
      font-size: 16px;
      line-height: 1.35;
      font-weight: 800;
    }

    .warcar-tab-note {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .warcar-tab-quality {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .quality-mark {
      display: inline-flex;
      align-items: center;
      min-height: 23px;
      border: 1px solid color-mix(in srgb, var(--quality-color) 55%, #ffffff);
      border-radius: 5px;
      padding: 1px 7px;
      color: #ffffff;
      background: var(--quality-color);
      font-size: 11px;
      font-weight: 850;
      line-height: 1.2;
      white-space: nowrap;
    }

    .quality-5 { --quality-color: #8164b5; --quality-soft: #f0eaff; }
    .quality-6 { --quality-color: #d97d2d; --quality-soft: #fff0df; }
    .quality-7 { --quality-color: #b84e5b; --quality-soft: #fae8eb; }
    .quality-8 { --quality-color: #b7902d; --quality-soft: #fff8dc; }
    .quality-9 { --quality-color: #8d672f; --quality-soft: #f5eadb; }
    .quality-10 { --quality-color: #71899f; --quality-soft: #edf4f8; }

    .calculator-section {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .calculator-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(270px, 0.8fr);
      align-items: center;
      gap: 18px;
      padding: 15px 17px;
    }

    .calculator-fields {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
    }

    .calculator-field {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .calculator-field input,
    .calculator-field select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px 10px;
      background: var(--panel-soft);
      color: var(--text);
      font: inherit;
      text-align: center;
    }

    .calculator-field input:focus-visible,
    .calculator-field select:focus-visible {
      outline: 2px solid rgba(60, 157, 133, 0.35);
      outline-offset: 2px;
      border-color: var(--jade);
    }

    .calculator-arrow {
      color: var(--gold);
      font-size: 21px;
      line-height: 1;
      font-weight: 800;
    }

    .calculator-result {
      display: grid;
      gap: 7px;
      justify-items: end;
      color: var(--jade);
    }

    .calculator-result-row {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 8px;
      width: 100%;
      white-space: nowrap;
    }

    .calculator-result-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .calculator-result-number {
      color: var(--gold);
      font-size: 29px;
      line-height: 1;
      font-weight: 900;
    }

    .calculator-result-unit {
      color: var(--muted);
      font-size: 12px;
    }

    .currency-icon {
      display: block;
      width: 27px;
      height: 27px;
      object-fit: contain;
      filter: drop-shadow(0 1px 2px rgba(50, 36, 20, 0.18));
    }

    .calculator-result.invalid .calculator-result-number,
    .calculator-result.invalid .calculator-result-label {
      color: #bd5945;
    }

    .calculator-result-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .calculator-cost-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px 10px;
      width: 100%;
    }

    .calculator-cost-list .item-cost,
    .calculator-cost-list .cost-cell {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      border: 1px solid rgba(60, 157, 133, 0.22);
      border-radius: 7px;
      padding: 3px 8px;
      color: var(--muted);
      background: var(--panel-soft);
      font-size: 12px;
      white-space: nowrap;
    }

    .calculator-attribute-result {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px 10px;
      grid-column: 1 / -1;
      border-top: 1px solid rgba(217, 203, 182, 0.8);
      padding-top: 11px;
      color: var(--jade);
      font-size: 13px;
      font-weight: 800;
    }

    .calculator-attribute-title {
      display: inline-flex;
      align-items: center;
      min-height: 23px;
      border: 1px solid currentColor;
      border-radius: 5px;
      padding: 0 7px;
      color: #9b6f1f;
      background: #fff2cf;
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }

    .calculator-attribute-line {
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
    }

    .calculator-attribute-result.empty,
    .calculator-result.invalid + .calculator-attribute-result {
      color: #bd5945;
    }

    .profile-panel,
    .table-section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .profile-panel {
      display: grid;
      grid-template-columns: minmax(230px, 0.8fr) minmax(0, 1.6fr);
      gap: 22px;
      padding: 18px;
    }

    .profile-main {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .profile-image {
      display: block;
      width: 132px;
      height: 104px;
      flex: 0 0 132px;
      object-fit: contain;
      filter: drop-shadow(0 5px 8px rgba(50, 36, 20, 0.18));
    }

    .profile-name {
      margin: 0;
      font-size: 23px;
      line-height: 1.25;
      font-weight: 850;
    }

    .profile-subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .profile-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .profile-badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .attribute-block { min-width: 0; }

    .section-label {
      margin: 0 0 9px;
      color: var(--jade);
      font-size: 15px;
      line-height: 1.3;
      font-weight: 850;
    }

    .attribute-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .attribute-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 31px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 9px;
      background: var(--panel-soft);
      font-size: 13px;
      line-height: 1.35;
      white-space: nowrap;
    }

    .attribute-item strong { color: var(--gold); }

    .attribute-block + .attribute-block {
      margin-top: 16px;
    }

    .table-sections {
      display: grid;
      gap: 16px;
      margin-top: 16px;
    }

    .table-section { overflow: hidden; }

    .table-section > summary { list-style: none; cursor: pointer; }
    .table-section > summary::-webkit-details-marker { display: none; }
    .table-section > summary::before {
      content: "▸";
      display: inline-block;
      margin-right: 8px;
      color: var(--jade);
      font-size: 18px;
      line-height: 1;
    }
    .table-section[open] > summary::before { content: "▾"; }
    .table-section > summary:focus-visible {
      outline: 2px solid rgba(60, 157, 133, 0.4);
      outline-offset: -2px;
    }

    .table-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 17px 12px;
      border-bottom: 1px solid var(--line);
    }

    .table-title {
      margin: 0;
      font-size: 19px;
      line-height: 1.3;
      font-weight: 850;
    }

    .table-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      text-align: right;
    }

    .table-wrap {
      overflow-x: auto;
      max-height: 570px;
    }

    table {
      width: 100%;
      min-width: 560px;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 9px 13px;
      border-bottom: 1px solid rgba(217, 203, 182, 0.72);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f4ead9;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    tbody tr:hover { background: var(--panel-hover); }

    .level-cell {
      color: var(--gold);
      font-weight: 800;
    }

    .cost-cell,
    .item-cost {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .item-icon {
      display: block;
      width: 28px;
      height: 28px;
      object-fit: contain;
      filter: drop-shadow(0 1px 2px rgba(50, 36, 20, 0.18));
    }

    .evolve-table { min-width: 760px; }

    .evolve-stage {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--jade);
      font-weight: 800;
    }

    .effect-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      white-space: normal;
    }

    .effect-list span { white-space: nowrap; }

    .empty-note {
      margin: 0;
      padding: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      margin-top: 26px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    .copyright-note {
      max-width: 760px;
      margin: 0;
      line-height: 1.7;
    }

    @media (max-width: 820px) {
      .warcar-tabs { grid-template-columns: 1fr; }
      .profile-panel { grid-template-columns: 1fr; gap: 14px; }
      .profile-main { padding-bottom: 4px; }
      .calculator-body { grid-template-columns: 1fr; gap: 14px; }
      .calculator-result { justify-items: start; }
      .calculator-result-row { justify-content: flex-start; }
      .calculator-cost-list { justify-content: flex-start; }
    }

    @media (max-width: 680px) {
      .shell { width: min(100% - 24px, 1180px); padding-top: 18px; }
      .site-header { padding-bottom: 16px; }
      .brand-mark { width: 96px; flex-basis: 96px; }
      .page-heading { align-items: flex-start; flex-direction: column; gap: 6px; margin-top: 22px; }
      .page-title { font-size: 26px; }
      .page-meta { text-align: left; }
      .warcar-tab { padding: 8px 11px; }
      .warcar-tab img { width: 50px; height: 50px; flex-basis: 50px; }
      .profile-panel { padding: 13px; }
      .profile-image { width: 106px; height: 84px; flex-basis: 106px; }
      .profile-name { font-size: 20px; }
      .calculator-body { padding: 13px; }
      .calculator-fields { grid-template-columns: 1fr; gap: 8px; }
      .calculator-arrow { justify-self: center; transform: rotate(90deg); }
      .table-heading { align-items: flex-start; flex-direction: column; gap: 5px; padding: 13px; }
      .table-note { text-align: left; }
      th, td { padding: 8px 10px; }
      footer { align-items: flex-start; flex-direction: column; gap: 12px; }
    }
  </style>
  <link rel="stylesheet" href="assets/table-attribute-standard.css?v=20260919">
  <script defer src="assets/table-attribute-standard.js"></script>
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <img class="brand-mark" src="assets/fangsan-logo.png" alt="放开那三国">
      <div class="brand-copy">
        <p class="brand-name">放三数据合集</p>
      </div>
      <a class="back-link" href="upgrade-materials.html">返回升级材料</a>
    </header>

    <section class="page-heading" aria-labelledby="page-title">
      <h1 class="page-title" id="page-title">战车</h1>
      <p class="page-meta">开启等级：58级　进阶开启：80级</p>
    </section>

    <nav class="warcar-tabs" id="warcar-tabs" aria-label="选择战车"></nav>
    <section class="profile-panel" id="profile-panel" aria-live="polite"></section>

    <section class="calculator-section" aria-labelledby="calculator-title">
      <div class="table-heading">
        <h2 class="table-title" id="calculator-title">强化计算器</h2>
        <p class="table-note">计算区间内的银币、精铁和属性变化</p>
      </div>
      <div class="calculator-body">
        <div class="calculator-fields">
          <label class="calculator-field" for="calculator-from">
            <span>从</span>
            <input id="calculator-from" type="number" min="0" max="200" step="1" value="0" aria-label="起始强化等级">
            <span>级</span>
          </label>
          <span class="calculator-arrow" aria-hidden="true">&#8594;</span>
          <label class="calculator-field" for="calculator-to">
            <span>到</span>
            <input id="calculator-to" type="number" min="0" max="200" step="1" value="200" aria-label="目标强化等级">
            <span>级</span>
          </label>
        </div>
        <div class="calculator-result" id="calculator-result" aria-live="polite">
          <div class="calculator-result-row">
            <span class="calculator-result-label"><img class="currency-icon" src="assets/lingdi-items/yinbi.png" alt="银币">银币</span>
            <strong class="calculator-result-number" id="calculator-silver">0</strong>
            <span class="calculator-result-unit">w</span>
          </div>
          <div class="calculator-result-row">
            <span class="calculator-result-label"><img class="currency-icon" src="assets/warcar-items/jingtie.png" alt="精铁">精铁</span>
            <strong class="calculator-result-number" id="calculator-iron">0</strong>
            <span class="calculator-result-unit">个</span>
          </div>
          <p class="calculator-result-note" id="calculator-result-note"></p>
        </div>
        <div class="calculator-attribute-result" id="calculator-attributes" aria-live="polite"></div>
      </div>
    </section>

    <section class="calculator-section" id="advance-calculator-section" aria-labelledby="advance-calculator-title" hidden>
      <div class="table-heading">
        <h2 class="table-title" id="advance-calculator-title">进阶计算器</h2>
        <p class="table-note">计算进阶区间的银币、进阶石和属性效果</p>
      </div>
      <div class="calculator-body">
        <div class="calculator-fields">
          <label class="calculator-field" for="advance-calculator-from">
            <span>从</span>
            <select id="advance-calculator-from" aria-label="起始进阶阶段"></select>
          </label>
          <span class="calculator-arrow" aria-hidden="true">&#8594;</span>
          <label class="calculator-field" for="advance-calculator-to">
            <span>到</span>
            <select id="advance-calculator-to" aria-label="目标进阶阶段"></select>
          </label>
        </div>
        <div class="calculator-result" id="advance-calculator-result" aria-live="polite">
          <div class="calculator-cost-list" id="advance-calculator-costs"></div>
          <p class="calculator-result-note" id="advance-calculator-note"></p>
        </div>
        <div class="calculator-attribute-result" id="advance-calculator-attributes" aria-live="polite"></div>
      </div>
    </section>

    <div class="table-sections">
      <details class="table-section" aria-labelledby="reinforce-title">
        <summary class="table-heading">
          <h2 class="table-title" id="reinforce-title">强化材料</h2>
          <p class="table-note">每级强化消耗银币和精铁</p>
        </summary>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>强化等级</th><th>银币</th><th>材料</th></tr>
            </thead>
            <tbody id="reinforce-body"></tbody>
          </table>
        </div>
      </details>

      <details class="table-section" aria-labelledby="evolve-title">
        <summary class="table-heading">
          <h2 class="table-title" id="evolve-title">进阶材料与属性</h2>
          <p class="table-note">升至对应品质或阶段时消耗</p>
        </summary>
        <div id="evolve-content"></div>
      </details>
    </div>

    <footer>
      <p class="copyright-note">
        本站为玩家自制的学习交流工具，非官方页面，与游戏官方无关。页面中如使用了游戏内截图、图标或相关素材，仅用于非商业性资料整理与交流展示，相关素材版权归原权利方所有。如有侵权或不当使用，请联系删除。
      </p>
    </footer>
  </main>

  <script src="assets/warcar-data.js"></script>
  <script>
    (() => {
      const data = window.warcarData;
      const tabs = document.getElementById('warcar-tabs');
      const profile = document.getElementById('profile-panel');
      const reinforceBody = document.getElementById('reinforce-body');
      const evolveContent = document.getElementById('evolve-content');
      const calculatorFrom = document.getElementById('calculator-from');
      const calculatorTo = document.getElementById('calculator-to');
      const calculatorResult = document.getElementById('calculator-result');
      const calculatorSilver = document.getElementById('calculator-silver');
      const calculatorIron = document.getElementById('calculator-iron');
      const calculatorResultNote = document.getElementById('calculator-result-note');
      const calculatorAttributes = document.getElementById('calculator-attributes');
      const advanceCalculatorSection = document.getElementById('advance-calculator-section');
      const advanceCalculatorFrom = document.getElementById('advance-calculator-from');
      const advanceCalculatorTo = document.getElementById('advance-calculator-to');
      const advanceCalculatorResult = document.getElementById('advance-calculator-result');
      const advanceCalculatorCosts = document.getElementById('advance-calculator-costs');
      const advanceCalculatorNote = document.getElementById('advance-calculator-note');
      const advanceCalculatorAttributes = document.getElementById('advance-calculator-attributes');
      const qualityNames = { 5: '紫色', 6: '橙色', 7: '红色', 8: '金色', 9: '暗金', 10: '白金' };
      const silverIcon = 'assets/lingdi-items/yinbi.png';
      const itemMap = new Map(data.chariots.map((item) => [item.id, item]));
      const materialMap = new Map(Object.entries(data.materials).map(([id, value]) => [Number(id), value]));
      let selectedId = data.chariots[0].id;

      const formatNumber = (value) => Number(value).toLocaleString('zh-CN');
      const formatSilverAmount = (value) => {
        const amount = Number(value) / 10000;
        return Number.isInteger(amount)
          ? formatNumber(amount)
          : amount.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
      };
      const attributeName = (id) => data.attributeNames[id] || `属性${id}`;
      const qualityName = (quality) => qualityNames[quality] || `品质${quality}`;
      const qualityMarkup = (quality) => `<span class="quality-mark quality-${quality}">${qualityName(quality)}</span>`;

      function formatAttribute(id, amount) {
        if (id === 56 || id === 57) return `${attributeName(id)} +${amount / 100}%`;
        return `${attributeName(id)} +${formatNumber(amount)}`;
      }

      function attributeMarkup(attributes) {
        return attributes.map(({ id, amount }) => `<span class="attribute-item">${attributeName(id)} <strong>+${id === 56 || id === 57 ? `${amount / 100}%` : formatNumber(amount)}</strong></span>`).join('');
      }

      function combatAttributeMarkup(chariot) {
        const items = [];
        for (const item of chariot.critical) items.push(`暴击 +${formatNumber(item.amount)}`);
        for (const item of chariot.criticalMultiple) items.push(`暴击倍数 +${formatNumber(item.amount)}`);
        for (const item of chariot.hit) items.push(`命中 +${formatNumber(item.amount)}`);
        return items.map((item) => `<span class="attribute-item">${item}</span>`).join('');
      }

      function costMarkup(cost) {
        const parts = [];
        if (cost.silver) parts.push(`<span class="cost-cell"><img class="currency-icon" src="${silverIcon}" alt="银币">银币 ×${formatSilverAmount(cost.silver)}w</span>`);
        for (const item of cost.materials) {
          const material = materialMap.get(item.id);
          const chariot = itemMap.get(item.id);
          const name = material ? material.name : chariot ? chariot.name : `物品${item.id}`;
          const icon = material ? material.icon : chariot ? chariot.smallIcon : '';
          parts.push(`<span class="item-cost">${icon ? `<img class="item-icon" src="${icon}" alt="${name}">` : ''}${name} ×${formatNumber(item.amount)}</span>`);
        }
        return parts.join('');
      }

      function stageName(stage) {
        if (stage.type === 2) return `${qualityMarkup(stage.quality)}<span>0阶</span>`;
        return `${qualityMarkup(stage.quality)}<span>${stage.level - 1}阶→${stage.level}阶</span>`;
      }

      function stageOptionName(stage) {
        if (stage.type === 2) return `${qualityName(stage.quality)} 0阶`;
        return `${qualityName(stage.quality)} ${stage.level - 1}阶→${stage.level}阶`;
      }

      function renderTabs() {
        tabs.innerHTML = data.chariots.map((chariot) => `
          <button class="warcar-tab${chariot.id === selectedId ? ' is-active' : ''}" type="button" data-id="${chariot.id}" aria-pressed="${chariot.id === selectedId}">
            <img src="${chariot.smallIcon}" alt="${chariot.name}图标">
            <span class="warcar-tab-copy">
              <span class="warcar-tab-name">${chariot.name}</span>
              <span class="warcar-tab-note warcar-tab-quality">${qualityMarkup(chariot.quality)}<span>${chariot.type}</span></span>
            </span>
          </button>
        `).join('');
        tabs.querySelectorAll('[data-id]').forEach((button) => {
          button.addEventListener('click', () => {
            selectedId = Number(button.dataset.id);
            render();
          });
        });
      }

      function renderProfile(chariot) {
        const maxAttributes = chariot.growthAttributes.map(({ id, amount }) => ({ id, amount: amount * chariot.maxLevel }));
        profile.innerHTML = `
          <div class="profile-main">
            <img class="profile-image" src="${chariot.bigIcon}" alt="${chariot.name}">
            <div>
              <h2 class="profile-name">${chariot.name}</h2>
              <p class="profile-subtitle">${chariot.desc} · 强化上限${chariot.maxLevel}级</p>
              <div class="profile-badges">
                ${qualityMarkup(chariot.quality)}
                <span class="profile-badge">战力系数 ${chariot.fightRatio}</span>
              </div>
            </div>
          </div>
          <div>
            <div class="attribute-block">
              <h3 class="section-label">基础属性</h3>
              <div class="attribute-row">${attributeMarkup(chariot.baseAttributes)}</div>
            </div>
            <div class="attribute-block">
              <h3 class="section-label">每级强化增加</h3>
              <div class="attribute-row">${attributeMarkup(chariot.growthAttributes)}</div>
            </div>
            <div class="attribute-block">
              <h3 class="section-label">强化至${chariot.maxLevel}级额外增加</h3>
              <div class="attribute-row">${attributeMarkup(maxAttributes)}</div>
            </div>
            <div class="attribute-block">
              <h3 class="section-label">战斗属性</h3>
              <div class="attribute-row">${combatAttributeMarkup(chariot)}</div>
            </div>
          </div>
        `;
      }

      function renderReinforce(chariot) {
        reinforceBody.innerHTML = chariot.reinforceCosts.map((row) => `
          <tr>
            <td class="level-cell">${row.level}级</td>
            <td><span class="cost-cell"><img class="currency-icon" src="${silverIcon}" alt="银币">银币 ×${formatSilverAmount(row.silver)}w</span></td>
            <td>${row.materials.map((item) => {
              const material = materialMap.get(item.id);
              return `<span class="item-cost"><img class="item-icon" src="${material.icon}" alt="${material.name}">${material.name} ×${formatNumber(item.amount)}</span>`;
            }).join('')}</td>
          </tr>
        `).join('');
      }

      function renderEvolve(chariot) {
        if (!chariot.evolveIds.length) {
          evolveContent.innerHTML = '<p class="empty-note">该战车暂无进阶配置。</p>';
          return;
        }
        const stages = chariot.evolveIds.map((id) => data.evolveStages.find((stage) => stage.id === id)).filter(Boolean);
        evolveContent.innerHTML = `
          <div class="table-wrap">
            <table class="evolve-table">
              <thead><tr><th>进阶阶段</th><th>消耗</th><th>获得属性 / 效果</th></tr></thead>
              <tbody>${stages.map((stage) => `
                <tr>
                  <td class="evolve-stage">${stageName(stage)}</td>
                  <td>${costMarkup(stage.cost)}</td>
                  <td><div class="effect-list">${stage.attributes.length ? stage.attributes.map(({ id, amount }) => `<span>${formatAttribute(id, amount)}</span>`).join('') : `<span>${stage.description.split('|').slice(1).join('')}</span>`}</div></td>
                </tr>
              `).join('')}</tbody>
            </table>
          </div>
          ${data.suit.items.includes(chariot.id) ? `<p class="empty-note">套装：${data.suit.name}（${data.suit.description}）</p>` : ''}
        `;
      }

      function readLevel(input, max) {
        const value = Number.parseInt(input.value, 10);
        if (!Number.isFinite(value)) return 0;
        return Math.min(max, Math.max(0, value));
      }

      function updateCalculator(chariot) {
        const maxLevel = chariot.maxLevel;
        calculatorFrom.max = String(maxLevel);
        calculatorTo.max = String(maxLevel);
        const fromLevel = readLevel(calculatorFrom, maxLevel);
        const toLevel = readLevel(calculatorTo, maxLevel);
        calculatorFrom.value = String(fromLevel);
        calculatorTo.value = String(toLevel);
        calculatorAttributes.replaceChildren();

        if (fromLevel > toLevel) {
          calculatorResult.classList.add('invalid');
          calculatorSilver.textContent = '!';
          calculatorIron.textContent = '!';
          calculatorResultNote.textContent = '起始等级不能高于目标等级';
          calculatorAttributes.classList.add('empty');
          calculatorAttributes.textContent = '请调整等级区间';
          return;
        }

        calculatorResult.classList.remove('invalid');
        calculatorAttributes.classList.remove('empty');
        const rows = chariot.reinforceCosts.filter((row) => row.level > fromLevel && row.level <= toLevel);
        const totalSilver = rows.reduce((total, row) => total + row.silver, 0);
        const totalIron = rows.reduce((total, row) => total + row.materials.reduce((sum, item) => sum + (item.id === 60052 ? item.amount : 0), 0), 0);
        calculatorSilver.textContent = formatSilverAmount(totalSilver);
        calculatorIron.textContent = formatNumber(totalIron);
        calculatorResultNote.textContent = rows.length ? `共${rows.length}级强化` : '没有跨过强化等级';

        const attributes = new Map();
        const addAttribute = (id, amount) => attributes.set(id, (attributes.get(id) || 0) + amount);
        if (fromLevel === 0 && toLevel > 0) {
          chariot.baseAttributes.forEach(({ id, amount }) => addAttribute(id, amount));
        }
        rows.forEach(() => chariot.growthAttributes.forEach(({ id, amount }) => addAttribute(id, amount)));
        const title = document.createElement('span');
        title.className = 'calculator-attribute-title';
        title.textContent = '属性变化';
        calculatorAttributes.appendChild(title);
        if (!attributes.size) {
          const empty = document.createElement('span');
          empty.className = 'calculator-attribute-line';
          empty.textContent = '无属性变化';
          calculatorAttributes.appendChild(empty);
          return;
        }
        attributes.forEach((amount, id) => {
          const line = document.createElement('span');
          line.className = 'calculator-attribute-line';
          line.textContent = formatAttribute(id, amount);
          calculatorAttributes.appendChild(line);
        });
      }

      function updateAdvanceCalculator(chariot) {
        const stages = chariot.evolveIds.map((id) => data.evolveStages.find((stage) => stage.id === id)).filter(Boolean);
        if (!stages.length) return;
        const fromIndex = Math.min(stages.length, Math.max(0, Number.parseInt(advanceCalculatorFrom.value, 10) || 0));
        const toIndex = Math.min(stages.length, Math.max(0, Number.parseInt(advanceCalculatorTo.value, 10) || 0));
        advanceCalculatorFrom.value = String(fromIndex);
        advanceCalculatorTo.value = String(toIndex);
        advanceCalculatorAttributes.replaceChildren();

        if (fromIndex > toIndex) {
          advanceCalculatorResult.classList.add('invalid');
          advanceCalculatorCosts.textContent = '!';
          advanceCalculatorNote.textContent = '起始阶段不能高于目标阶段';
          advanceCalculatorAttributes.classList.add('empty');
          advanceCalculatorAttributes.textContent = '请调整进阶区间';
          return;
        }

        advanceCalculatorResult.classList.remove('invalid');
        advanceCalculatorAttributes.classList.remove('empty');
        const selectedStages = stages.filter((stage, index) => index + 1 > fromIndex && index + 1 <= toIndex);
        const totalCost = { silver: 0, materials: [] };
        const materialTotals = new Map();
        selectedStages.forEach((stage) => {
          totalCost.silver += stage.cost.silver;
          stage.cost.materials.forEach((item) => materialTotals.set(item.id, (materialTotals.get(item.id) || 0) + item.amount));
        });
        totalCost.materials = [...materialTotals].map(([id, amount]) => ({ id, amount }));
        advanceCalculatorCosts.innerHTML = selectedStages.length ? costMarkup(totalCost) : '<span class="empty-note">无消耗</span>';
        advanceCalculatorNote.textContent = selectedStages.length ? `共${selectedStages.length}段进阶` : '没有跨过进阶阶段';

        const attributes = new Map();
        const effects = [];
        selectedStages.forEach((stage) => {
          stage.attributes.forEach(({ id, amount }) => attributes.set(id, (attributes.get(id) || 0) + amount));
          if (!stage.attributes.length) {
            const effect = stage.description.split('|').slice(1).join('');
            if (effect && !effects.includes(effect)) effects.push(effect);
          }
        });
        const title = document.createElement('span');
        title.className = 'calculator-attribute-title';
        title.textContent = '属性 / 效果';
        advanceCalculatorAttributes.appendChild(title);
        attributes.forEach((amount, id) => {
          const line = document.createElement('span');
          line.className = 'calculator-attribute-line';
          line.textContent = formatAttribute(id, amount);
          advanceCalculatorAttributes.appendChild(line);
        });
        effects.forEach((effect) => {
          const line = document.createElement('span');
          line.className = 'calculator-attribute-line';
          line.textContent = effect;
          advanceCalculatorAttributes.appendChild(line);
        });
        if (!attributes.size && !effects.length) {
          const empty = document.createElement('span');
          empty.className = 'calculator-attribute-line';
          empty.textContent = '无属性变化';
          advanceCalculatorAttributes.appendChild(empty);
        }
      }

      function renderAdvanceCalculator(chariot) {
        const stages = chariot.evolveIds.map((id) => data.evolveStages.find((stage) => stage.id === id)).filter(Boolean);
        if (!stages.length) {
          advanceCalculatorSection.hidden = true;
          return;
        }
        advanceCalculatorSection.hidden = false;
        advanceCalculatorFrom.innerHTML = `<option value="0">当前${qualityName(chariot.quality)}</option>${stages.map((stage, index) => `<option value="${index + 1}">${stageOptionName(stage)}</option>`).join('')}`;
        advanceCalculatorTo.innerHTML = `<option value="0">当前${qualityName(chariot.quality)}</option>${stages.map((stage, index) => `<option value="${index + 1}">${stageOptionName(stage)}</option>`).join('')}`;
        advanceCalculatorFrom.value = '0';
        advanceCalculatorTo.value = String(stages.length);
        updateAdvanceCalculator(chariot);
      }

      function render() {
        const chariot = itemMap.get(selectedId);
        renderTabs();
        renderProfile(chariot);
        renderReinforce(chariot);
        renderEvolve(chariot);
        updateCalculator(chariot);
        renderAdvanceCalculator(chariot);
      }

      calculatorFrom.addEventListener('input', () => updateCalculator(itemMap.get(selectedId)));
      calculatorTo.addEventListener('input', () => updateCalculator(itemMap.get(selectedId)));
      advanceCalculatorFrom.addEventListener('change', () => updateAdvanceCalculator(itemMap.get(selectedId)));
      advanceCalculatorTo.addEventListener('change', () => updateAdvanceCalculator(itemMap.get(selectedId)));
      render();
    })();
  </script>
</body>
</html>
