<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="放三升级材料消耗表。">
  <title>升级材料消耗表 - 放三数据合集</title>
  <link rel="icon" type="image/png" href="assets/fangsan-logo.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe5;
      --panel: #fff8ec;
      --panel-hover: #fff3dc;
      --text: #27231e;
      --muted: #746d62;
      --line: #d9cbb6;
      --jade: #3c9d85;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    a { color: inherit; }

    .shell {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 22px;
    }

    .brand-mark {
      display: block;
      width: 118px;
      height: auto;
      flex: 0 0 118px;
      object-fit: contain;
      filter: drop-shadow(0 5px 14px rgba(0, 0, 0, 0.22));
    }

    .brand-copy { min-width: 0; flex: 1 1 auto; }

    .brand-name {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
      font-weight: 750;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .page-title {
      margin: 26px 0 14px;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 850;
    }

    .material-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .material-card {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 78px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .material-card:hover {
      transform: translateY(-2px);
      border-color: #65756f;
      background: var(--panel-hover);
      box-shadow: 0 8px 18px rgba(69, 56, 39, 0.1);
    }

    .material-card:focus-visible {
      outline: 3px solid rgba(60, 157, 133, 0.4);
      outline-offset: 2px;
    }

    .material-icon {
      display: grid;
      place-items: center;
      flex: 0 0 52px;
      width: 52px;
      height: 52px;
      overflow: hidden;
      border: 1px solid rgba(217, 203, 182, 0.9);
      border-radius: 8px;
      background: #f3e8d5;
    }

    .material-icon img {
      display: block;
      max-width: 44px;
      max-height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 2px 3px rgba(50, 36, 20, 0.16));
    }

    .material-copy {
      min-width: 0;
    }

    .material-title {
      margin: 0;
      color: var(--text);
      font-size: 16px;
      line-height: 1.35;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      margin-top: 26px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    .copyright-note {
      max-width: 760px;
      margin: 0;
      line-height: 1.7;
    }

    @media (max-width: 980px) {
      .material-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 680px) {
      .shell { width: min(100% - 24px, 1180px); padding-top: 18px; }
      .site-header { padding-bottom: 16px; }
      .brand-mark { width: 96px; flex-basis: 96px; }
      .page-title { margin-top: 22px; font-size: 26px; }
      .material-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .material-card { min-height: 68px; gap: 9px; padding: 9px 10px; }
      .material-icon { flex-basis: 44px; width: 44px; height: 44px; }
      .material-icon img { max-width: 37px; max-height: 37px; }
      .material-title { font-size: 14px; }
      footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }
    }

  </style>
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <img class="brand-mark" src="assets/fangsan-logo.png" alt="放开那三国">
      <div class="brand-copy">
        <p class="brand-name">放三数据合集</p>
      </div>
      <a class="back-link" href="index.html">返回首页</a>
    </header>

    <h1 class="page-title">升级材料消耗表</h1>

    <nav class="material-grid" aria-label="升级材料消耗表入口">
      <a class="material-card" href="houjun-upgrade.html">
        <span class="material-icon"><img src="assets/lingdi-icons/lingdi_n.png" alt="后军与领地图标"></span>
        <span class="material-copy"><h2 class="material-title">后军</h2></span>
      </a>
      <a class="material-card" href="protagonist-fashion.html">
        <span class="material-icon"><img src="assets/fashion-gallery/male-small-01.png" alt="主角时装图标"></span>
        <span class="material-copy"><h2 class="material-title">主角时装</h2></span>
      </a>
      <a class="material-card" href="hero-destiny.html">
        <span class="material-icon"><img src="assets/hero-destiny-items/tianmingshi.png" alt="天命石图标"></span>
        <span class="material-copy"><h2 class="material-title">天命</h2></span>
      </a>
    </nav>

    <footer>
      <p class="copyright-note">
        本站为玩家自制的学习交流工具，非官方页面，与游戏官方无关。页面中如使用了游戏内截图、图标或相关素材，仅用于非商业性资料整理与交流展示，相关素材版权归原权利方所有。如有侵权或不当使用，请联系删除。
      </p>
    </footer>
  </main>
</body>
</html>
