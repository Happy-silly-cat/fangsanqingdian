<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="放三战意来源、提升条件与属性效果查询表。">
  <title>战意属性查询 - 放三数据合集</title>
  <link rel="icon" type="image/png" href="assets/fangsan-logo.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe5;
      --panel: #fff8ec;
      --panel-strong: #fffdf8;
      --panel-hover: #fff3dc;
      --text: #27231e;
      --muted: #746d62;
      --line: #d9cbb6;
      --jade: #3c9d85;
      --jade-dark: #173f35;
      --gold: #b8842f;
      --purple: #64518f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    a { color: inherit; }

    .shell {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 20px 0 32px;
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 52px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }

    .brand-mark {
      display: block;
      width: 118px;
      height: auto;
      flex: 0 0 118px;
      object-fit: contain;
      filter: drop-shadow(0 5px 14px rgba(0, 0, 0, 0.22));
    }

    .brand-copy { min-width: 0; flex: 1 1 auto; }

    .brand-name {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
      font-weight: 750;
    }

    .back-link,
    .search-input {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .intro {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin: 14px 0 12px;
    }

    .page-title {
      margin: 0;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 850;
    }

    .page-note,
    .section-meta,
    .summary-meta {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .summary-panel,
    .section-panel,
    .table-wrap {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .summary-panel,
    .section-panel { margin-top: 12px; padding: 14px 16px; }

    .summary-panel {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .morale-icon {
      display: block;
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      object-fit: contain;
      filter: drop-shadow(0 5px 8px rgba(75, 32, 32, 0.2));
    }

    .summary-main { min-width: 0; flex: 1 1 auto; }

    .summary-heading,
    .section-head,
    .search-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .summary-title,
    .section-title {
      margin: 0;
      color: var(--jade-dark);
      font-size: 18px;
      line-height: 1.3;
      font-weight: 850;
    }

    .badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border: 1px solid rgba(184, 132, 47, 0.28);
      border-radius: 7px;
      background: var(--panel-strong);
      padding: 4px 9px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .section-head { margin-bottom: 9px; }
    .search-label { color: var(--jade-dark); font-size: 13px; font-weight: 800; }

    .search-input {
      width: min(360px, 100%);
      min-height: 36px;
      padding: 7px 10px;
      font: inherit;
      font-size: 13px;
    }

    .search-input:focus-visible,
    .back-link:focus-visible {
      outline: 2px solid rgba(60, 157, 133, 0.35);
      outline-offset: 2px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      border-bottom: 1px solid rgba(217, 203, 182, 0.8);
      padding: 9px 12px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: rgba(231, 187, 97, 0.12);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--panel-hover); }

    .source-name,
    .number,
    .quality-name {
      color: var(--purple);
      font-weight: 850;
      white-space: nowrap;
    }

    .number { color: var(--gold); }
    .effect-table table { min-width: 650px; }

    footer {
      margin-top: 26px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    .copyright-note { max-width: 760px; margin: 0; line-height: 1.7; }

    @media (max-width: 720px) {
      .shell { width: min(100% - 24px, 1180px); padding-top: 16px; }
      .site-header { padding-bottom: 12px; }
      .brand-mark { width: 96px; flex-basis: 96px; }
      .intro { display: block; }
      .page-title { font-size: 25px; }
      .page-note { margin-top: 5px; }
      .summary-panel { align-items: flex-start; }
      .morale-icon { width: 64px; height: 64px; flex-basis: 64px; }
      .summary-heading,
      .section-head,
      .search-row { align-items: flex-start; flex-direction: column; gap: 5px; }
      .section-title { font-size: 17px; }
      .search-input { width: 100%; }
      table { font-size: 12.5px; }
      th, td { padding: 8px 9px; }
    }
  </style>
  <link rel="stylesheet" href="assets/table-attribute-standard.css?v=20260919">
  <script defer src="assets/table-attribute-standard.js"></script>
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <img class="brand-mark" src="assets/fangsan-logo.png" alt="放开那三国">
      <div class="brand-copy"><p class="brand-name">放三数据合集</p></div>
      <a class="back-link" href="upgrade-materials.html">返回入口</a>
    </header>

    <section class="intro">
      <h1 class="page-title">战意属性查询</h1>
      <p class="page-note">查看战意来源、提升条件与属性效果</p>
    </section>

    <section class="summary-panel">
      <img class="morale-icon" src="assets/morale-icons/morale_n.png" alt="战意图标">
      <div class="summary-main">
        <div class="summary-heading">
          <h2 class="summary-title">战意</h2>
          <span class="summary-meta">不同功能的养成进度会共同计入战意</span>
        </div>
        <div class="badge-list">
          <span class="badge">战意功能：116级开启</span>
          <span class="badge" id="source-badge">提升规则：239条</span>
          <span class="badge" id="effect-badge">属性档位：80档</span>
        </div>
      </div>
    </section>

    <section class="section-panel">
      <div class="search-row">
        <div>
          <h2 class="section-title">战意提升来源</h2>
          <p class="section-meta">功能、条件、每次增加的战意与统计上限</p>
        </div>
        <label class="search-label" for="source-search">
          搜索功能或条件
          <input class="search-input" id="source-search" type="search" placeholder="例如：锦囊、军师、暗金">
        </label>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th scope="col">功能</th><th scope="col">提升条件</th><th scope="col">对应战意</th><th scope="col">每次增加</th><th scope="col">统计上限</th></tr>
          </thead>
          <tbody id="source-table"></tbody>
        </table>
      </div>
      <p class="section-meta" id="source-count" style="margin-top: 9px;"></p>
    </section>

    <section class="section-panel effect-table">
      <div class="section-head">
        <h2 class="section-title">战意属性效果</h2>
        <span class="section-meta">达到对应战意后获得的全队效果</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">战意达到</th><th scope="col">属性或效果</th><th scope="col">档位</th></tr></thead>
          <tbody id="effect-table"></tbody>
        </table>
      </div>
    </section>

    <footer>
      <p class="copyright-note">
        本站为玩家自制的学习交流工具，非官方页面，与游戏官方无关。页面中如使用了游戏内截图、图标或相关素材，仅用于非商业性资料整理与交流展示，相关素材版权归原权利方所有。如有侵权或不当使用，请联系删除。
      </p>
    </footer>
  </main>

  <script src="assets/morale-data.js"></script>
  <script>
    (() => {
      const data = window.moraleData;
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
      const number = (value) => Number(value).toLocaleString("zh-CN");
      const formatTarget = (value) => {
        const parts = String(value ?? "").split("|");
        if (parts.length > 1) return `${parts[0]}级${data.qualityNames[parts[1]] || "品质"}`;
        return `${parts[0]}档`;
      };

      const renderSources = (query = "") => {
        const normalized = query.trim().toLowerCase();
        const rows = data.sources.filter((row) => {
          const haystack = `${row.name} ${row.description} ${row.target}`.toLowerCase();
          return !normalized || haystack.includes(normalized);
        });
        document.getElementById("source-table").innerHTML = rows.map((row) => `
          <tr>
            <td class="source-name">${escapeHtml(row.name)}</td>
            <td>${escapeHtml(row.description)}</td>
            <td class="quality-name">${escapeHtml(formatTarget(row.target))}</td>
            <td class="number">${number(row.add)}</td>
            <td class="number">${number(row.limit)}</td>
          </tr>
        `).join("") || '<tr><td colspan="5">没有匹配的战意来源</td></tr>';
        document.getElementById("source-count").textContent = `当前显示 ${rows.length} / ${data.sources.length} 条提升规则`;
      };

      document.getElementById("effect-table").innerHTML = [...data.effects]
        .sort((a, b) => a.threshold - b.threshold)
        .map((row) => `
          <tr><td class="number">${number(row.threshold)}</td><td>${escapeHtml(row.effect)}</td><td class="quality-name">${number(row.id)}档</td></tr>
        `).join("");
      document.getElementById("source-search").addEventListener("input", (event) => renderSources(event.target.value));
      renderSources();
    })();
  </script>
</body>
</html>
