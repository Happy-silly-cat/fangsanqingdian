<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="放三兵符升级、进阶、精炼属性和材料查询表。">
  <title>兵符升级与进阶 - 放三数据合集</title>
  <link rel="icon" type="image/png" href="assets/fangsan-logo.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe5;
      --panel: #fffaf0;
      --panel-strong: #fffdf8;
      --panel-hover: #fff2d9;
      --text: #27231e;
      --muted: #766e62;
      --line: #d9cbb6;
      --jade: #3c9d85;
      --jade-dark: #173f35;
      --gold: #b8842f;
      --purple: #66528e;
      --red: #a74e42;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    a { color: inherit; }

    .shell {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 20px 0 34px;
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 52px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }

    .brand-mark {
      display: block;
      width: 118px;
      flex: 0 0 118px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 5px 14px rgba(0, 0, 0, 0.18));
    }

    .brand-copy { min-width: 0; flex: 1 1 auto; }
    .brand-name { margin: 0; font-size: 19px; line-height: 1.25; font-weight: 800; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--panel);
      text-decoration: none;
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
    }

    .back-link:focus-visible,
    .item-button:focus-visible { outline: 2px solid rgba(60, 157, 133, 0.45); outline-offset: 2px; }

    .intro { display: flex; align-items: baseline; gap: 16px; margin: 14px 0 12px; }
    .page-title { margin: 0; font-size: 27px; line-height: 1.2; font-weight: 850; }
    .page-note, .section-meta { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }

    .section-panel {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 14px 16px;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .section-title { margin: 0; color: var(--jade-dark); font-size: 18px; line-height: 1.3; font-weight: 850; }

    .item-groups { display: grid; gap: 13px; }
    .item-group { display: grid; gap: 7px; }
    .group-title { margin: 0; color: var(--muted); font-size: 12px; font-weight: 800; }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 8px;
    }

    .item-button {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel-strong);
      color: var(--text);
      padding: 7px 8px;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }

    .item-button:hover { background: var(--panel-hover); border-color: rgba(184, 132, 47, 0.65); }
    .item-button.is-active { border-color: var(--jade); box-shadow: inset 0 0 0 1px var(--jade); background: #f0f8f3; }

    .item-icon {
      display: block;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      object-fit: contain;
    }

    .item-copy { min-width: 0; }
    .item-name { display: block; overflow: hidden; font-size: 13px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .item-quality { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }

    .profile {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 86px;
      border-bottom: 1px solid rgba(217, 203, 182, 0.8);
      padding-bottom: 12px;
    }

    .profile-icon {
      display: block;
      width: 82px;
      height: 82px;
      flex: 0 0 82px;
      object-fit: contain;
      filter: drop-shadow(0 5px 8px rgba(107, 72, 23, 0.18));
    }

    .profile-copy { min-width: 0; flex: 1 1 auto; }
    .profile-name { margin: 0; color: var(--jade-dark); font-size: 22px; line-height: 1.3; font-weight: 850; }
    .profile-meta { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }

    .material-line,
    .attribute-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px 12px;
    }

    .material-line { margin-top: 8px; }

    .material-item,
    .attribute-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 28px;
      border: 1px solid rgba(184, 132, 47, 0.26);
      border-radius: 6px;
      background: var(--panel-strong);
      padding: 3px 7px;
      font-size: 12px;
      white-space: nowrap;
    }

    .material-item img { width: 27px; height: 27px; object-fit: contain; }
    .material-item strong, .attribute-pill strong, .number { color: var(--gold); font-weight: 850; }

    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 7px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid rgba(217, 203, 182, 0.8); padding: 9px 11px; text-align: left; vertical-align: middle; }
    th { background: rgba(231, 187, 97, 0.12); color: var(--muted); font-size: 12px; font-weight: 800; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--panel-hover); }
    .attribute-cell { min-width: 255px; }
    .cost-cell { min-width: 260px; }
    .stage-label { color: var(--purple); font-weight: 850; white-space: nowrap; }
    .muted { color: var(--muted); }

    .quality-upgrade {
      margin-top: 10px;
      border-left: 3px solid var(--gold);
      padding: 7px 0 7px 11px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .quality-upgrade strong { color: var(--text); }
    .empty { color: var(--muted); }

    footer { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 20px; color: var(--muted); font-size: 12px; }
    .copyright-note { max-width: 760px; margin: 0; line-height: 1.7; }

    @media (max-width: 720px) {
      .shell { width: min(100% - 24px, 1180px); padding-top: 16px; }
      .brand-mark { width: 96px; flex-basis: 96px; }
      .intro { display: block; }
      .page-title { font-size: 25px; }
      .page-note { margin-top: 5px; }
      .section-head { align-items: flex-start; flex-direction: column; gap: 3px; }
      .section-title { font-size: 17px; }
      .profile { align-items: flex-start; }
      .profile-icon { width: 68px; height: 68px; flex-basis: 68px; }
      .profile-name { font-size: 19px; }
      .item-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
      .item-button { padding: 6px; }
      .item-icon { width: 37px; height: 37px; flex-basis: 37px; }
      .item-name { font-size: 12px; }
      table { font-size: 12.5px; }
      th, td { padding: 8px 9px; }
    }
  </style>
  <link rel="stylesheet" href="assets/table-attribute-standard.css?v=20260919">
  <script defer src="assets/table-attribute-standard.js"></script>
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <img class="brand-mark" src="assets/fangsan-logo.png" alt="放开那三国">
      <div class="brand-copy"><p class="brand-name">放三数据合集</p></div>
      <a class="back-link" href="upgrade-materials.html">返回入口</a>
    </header>

    <section class="intro">
      <h1 class="page-title">兵符升级与进阶</h1>
      <p class="page-note">查看兵符升级、进阶、精炼属性和材料</p>
    </section>

    <section class="section-panel">
      <div class="section-head">
        <h2 class="section-title">兵符选择</h2>
        <span class="section-meta">共 27 个兵符配置</span>
      </div>
      <div id="item-groups" class="item-groups"></div>
    </section>

    <section class="section-panel">
      <div class="profile">
        <img id="profile-icon" class="profile-icon" src="assets/bingfu-items/seal-n.png" alt="">
        <div class="profile-copy">
          <h2 id="profile-name" class="profile-name"></h2>
          <p id="profile-meta" class="profile-meta"></p>
          <div id="profile-materials" class="material-line"></div>
        </div>
      </div>
    </section>

    <section class="section-panel">
      <div class="section-head">
        <h2 class="section-title">升级属性</h2>
        <span class="section-meta">基础属性和强化等级属性</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">项目</th><th scope="col">属性</th><th scope="col">说明</th></tr></thead>
          <tbody id="strengthen-table"></tbody>
        </table>
      </div>
    </section>

    <section class="section-panel">
      <div class="section-head">
        <h2 class="section-title">进阶属性</h2>
        <span class="section-meta">每次进阶新增属性和消耗</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">进阶至</th><th scope="col">新增属性</th><th scope="col">消耗</th></tr></thead>
          <tbody id="advance-table"></tbody>
        </table>
      </div>
      <div id="quality-upgrade" class="quality-upgrade"></div>
    </section>

    <section class="section-panel">
      <div class="section-head">
        <h2 class="section-title">精炼属性</h2>
        <span class="section-meta">每档精炼效果和消耗</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">精炼至</th><th scope="col">效果</th><th scope="col">消耗</th></tr></thead>
          <tbody id="refine-table"></tbody>
        </table>
      </div>
    </section>

    <footer>
      <p class="copyright-note">
        本站为玩家自制的学习交流工具，非官方页面，与游戏官方无关。页面中如使用了游戏内截图、图标或相关素材，仅用于非商业性资料整理与交流展示，相关素材版权归原权利方所有。如有侵权或不当使用，请联系删除。
      </p>
    </footer>
  </main>

  <script src="assets/bingfu-data.js"></script>
  <script>
    (() => {
      const data = window.bingfuData;
      const itemGroups = document.querySelector("#item-groups");
      const profileIcon = document.querySelector("#profile-icon");
      const profileName = document.querySelector("#profile-name");
      const profileMeta = document.querySelector("#profile-meta");
      const profileMaterials = document.querySelector("#profile-materials");
      const strengthenTable = document.querySelector("#strengthen-table");
      const advanceTable = document.querySelector("#advance-table");
      const refineTable = document.querySelector("#refine-table");
      const qualityUpgrade = document.querySelector("#quality-upgrade");
      const number = (value) => Number(value || 0).toLocaleString("zh-CN");
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
      const qualityLabel = (quality) => `品质 ${quality}`;

      // 兵符字段中的 109 是单独的效果类型，不属于本页的兵符属性，因此不输出。
      function parseAttributes(raw) {
        return String(raw || "").split(",").map((entry) => {
          const [id, value] = entry.split("|").map(Number);
          return { id, value };
        }).filter((entry) => Number.isFinite(entry.id) && Number.isFinite(entry.value) && entry.id !== 109);
      }

      function parseAttributeStages(raw) {
        return String(raw || "").split(";").map((stage) => parseAttributes(stage));
      }

      function parseCostRows(raw) {
        return String(raw || "").split(";").filter(Boolean).map((row) => row.split(",").map((token) => {
          const parts = token.split("|");
          if (parts[0] === "1" || parts[0] === "11") return { type: "gold", amount: Number(parts[2]) || 0 };
          if (parts[0] === "7") return { type: "item", id: String(parts[1]), amount: Number(parts[2]) || 0 };
          return null;
        }).filter(Boolean));
      }

      function parseRefineEffects(raw) {
        return String(raw || "").split(",").filter(Boolean).map((entry) => {
          const [level, id] = entry.split("|");
          const effect = data.effects[String(id)] || {};
          return { level: Number(level), id: String(id), name: effect.name || `效果 ${id}`, description: effect.description || "暂无效果文字" };
        });
      }

      const itemMap = Object.fromEntries(data.items.map((item) => [String(item.id), item]));
      const fragmentMap = Object.fromEntries(data.fragments.map((item) => [String(item.targetId), item]));
      const materialMap = Object.fromEntries(Object.entries(data.materials).map(([id, material]) => [id, {
        ...material,
        // Material records already store a filename; iconFor adds the shared directory once.
        icon: material.icon
      }]));

      function resolveIcon(icon) {
        if (!icon) return `${data.iconRoot}seal-n.png`;
        return String(icon).includes("/") ? String(icon) : `${data.iconRoot}${icon}`;
      }

      function iconFor(id) {
        const item = itemMap[String(id)] || fragmentMap[String(id)] || materialMap[String(id)];
        return item ? resolveIcon(item.icon) : resolveIcon("seal-n.png");
      }

      function labelFor(id) {
        const item = itemMap[String(id)] || fragmentMap[String(id)] || materialMap[String(id)];
        return item ? item.name : `材料 ${id}`;
      }

      function attributeMarkup(attributes) {
        if (!attributes.length) return `<span class="empty">无新增属性</span>`;
        return `<div class="attribute-list">${attributes.map(({ id, value }) => `<span class="attribute-pill">${escapeHtml(data.attributeNames[String(id)] || `属性 ${id}`)} <strong>+${number(value)}</strong></span>`).join("")}</div>`;
      }

      function costMarkup(costs) {
        if (!costs.length) return `<span class="empty">无消耗</span>`;
        return `<div class="material-line">${costs.map((cost) => cost.type === "gold"
          ? `<span class="material-item"><span>金币</span><strong>×${number(cost.amount)}</strong></span>`
          : `<span class="material-item"><img src="${escapeHtml(iconFor(cost.id))}" alt=""><span>${escapeHtml(labelFor(cost.id))}</span><strong>×${number(cost.amount)}</strong></span>`).join("")}</div>`;
      }

      function renderSelector(selectedId) {
        const groups = new Map();
        data.items.forEach((item) => {
          if (!groups.has(item.quality)) groups.set(item.quality, []);
          groups.get(item.quality).push(item);
        });
        itemGroups.innerHTML = [...groups.entries()].map(([quality, items]) => `
          <div class="item-group">
            <h3 class="group-title">${qualityLabel(quality)}</h3>
            <div class="item-grid">
              ${items.map((item) => `<button class="item-button${item.id === selectedId ? " is-active" : ""}" type="button" data-item-id="${item.id}">
                <img class="item-icon" src="${escapeHtml(iconFor(item.id))}" alt="">
                <span class="item-copy"><span class="item-name">${escapeHtml(item.name)}</span><span class="item-quality">上限 ${number(item.maxLevel)} 级</span></span>
              </button>`).join("")}
            </div>
          </div>
        `).join("");
        itemGroups.querySelectorAll("[data-item-id]").forEach((button) => {
          button.addEventListener("click", () => renderItem(Number(button.dataset.itemId)));
        });
      }

      function renderItem(id) {
        const item = itemMap[String(id)] || data.items[0];
        renderSelector(item.id);
        profileIcon.src = iconFor(item.id);
        profileIcon.alt = item.name;
        profileName.textContent = item.name;
        profileMeta.textContent = `${qualityLabel(item.quality)} · 强化上限 ${number(item.maxLevel)} 级 · 属性按基础值与每级提升递增`;

        const fragment = fragmentMap[String(item.id)];
        profileMaterials.innerHTML = fragment
          ? `<span class="material-item"><img src="${escapeHtml(resolveIcon(fragment.icon))}" alt=""><span>${escapeHtml(fragment.name)}</span><strong>×${number(fragment.need)}合成</strong></span>`
          : `<span class="muted">暂无独立合成碎片记录</span>`;

        const base = parseAttributes(item.baseAttributes);
        const growth = parseAttributes(item.growthAttributes);
        const maxAttributes = Object.fromEntries([...base, ...growth].map(({ id }) => [id, 0]));
        base.forEach(({ id, value }) => { maxAttributes[id] = (maxAttributes[id] || 0) + value; });
        growth.forEach(({ id, value }) => { maxAttributes[id] = (maxAttributes[id] || 0) + value * item.maxLevel; });
        strengthenTable.innerHTML = `
          <tr><td class="stage-label">基础属性</td><td class="attribute-cell">${attributeMarkup(base)}</td><td class="muted">兵符初始属性</td></tr>
          <tr><td class="stage-label">每级提升</td><td class="attribute-cell">${attributeMarkup(growth)}</td><td class="muted">强化等级每提升 1 级增加</td></tr>
          <tr><td class="stage-label">${number(item.maxLevel)} 级</td><td class="attribute-cell">${attributeMarkup(Object.entries(maxAttributes).map(([id, value]) => ({ id: Number(id), value })))}</td><td class="muted">基础属性 + 每级提升 × ${number(item.maxLevel)}</td></tr>
        `;

        const advanceLevels = String(item.advanceLevels || "").split("|").map(Number).filter(Number.isFinite);
        const advanceAttributes = parseAttributeStages(item.advanceAttributes);
        const advanceCosts = parseCostRows(item.advanceCosts);
        advanceTable.innerHTML = advanceLevels.map((level, index) => `
          <tr><td class="stage-label">${number(level)} 级</td><td class="attribute-cell">${attributeMarkup(advanceAttributes[index + 1] || [])}</td><td class="cost-cell">${costMarkup(advanceCosts[index] || [])}</td></tr>
        `).join("");

        if (item.qualityUpgradeId) {
          const target = itemMap[String(item.qualityUpgradeId)];
          const targetName = target ? `${target.name}（${qualityLabel(target.quality)}）` : `品质 ${item.quality + 1}`;
          const limit = String(item.qualityUpgradeLimit || "").replaceAll("|", " / ");
          const specialAttributes = parseAttributes(item.qualityUpgradeAttributes);
          qualityUpgrade.innerHTML = `<strong>品质进阶：</strong>可转为 ${escapeHtml(targetName)}；解包条件 ${escapeHtml(limit || "暂无记录")}；${attributeMarkup(specialAttributes)}；${costMarkup(parseCostRows(item.qualityUpgradeCost)[0] || [])}`;
          qualityUpgrade.hidden = false;
        } else {
          qualityUpgrade.hidden = true;
        }

        const refineLevels = String(item.refineLevels || "").split("|").map(Number).filter(Number.isFinite);
        const refineEffects = parseRefineEffects(item.refineEffects);
        const refineCosts = parseCostRows(item.refineCosts);
        refineTable.innerHTML = refineEffects.map((effect, index) => {
          const level = index === 0 ? 0 : refineLevels[index - 1];
          const cost = index === 0 ? [] : refineCosts[index - 1] || [];
          const levelLabel = index === 0 ? "0 级（基础）" : `${number(level)} 级`;
          return `<tr><td class="stage-label">${levelLabel}</td><td><strong>${escapeHtml(effect.name || "")}</strong><br><span class="muted">${escapeHtml(effect.description || "暂无效果文字")}</span></td><td class="cost-cell">${costMarkup(cost)}</td></tr>`;
        }).join("");
      }

      renderItem(data.items[0].id);
    })();
  </script>
</body>
</html>
