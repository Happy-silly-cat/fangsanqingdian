<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宠物属性与升星</title>
  <style>
    :root {
      --page: #f3ecdf;
      --panel: #fff8eb;
      --panel-soft: #fffdf7;
      --line: #dfcfb8;
      --ink: #173f3d;
      --muted: #887968;
      --gold: #b37a1c;
      --gold-soft: #fff0c8;
      --green: #2c9b87;
      --green-soft: #d9f0e7;
      --purple: #7b5bbb;
      --purple-soft: #eee7ff;
      --shadow: 0 12px 32px rgba(87, 60, 24, .06);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 22px 0 56px; }
    .site-header {
      min-height: 100px;
      display: flex;
      align-items: center;
      gap: 22px;
      border-bottom: 1px solid var(--line);
    }
    .brand-mark { width: 154px; height: auto; object-fit: contain; }
    .brand-name { margin: 0; color: #27231f; font-size: 26px; font-weight: 800; }
    .back-link {
      margin-left: auto;
      padding: 12px 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: #28241f;
      background: rgba(255, 253, 247, .7);
      text-decoration: none;
      font-weight: 800;
    }
    .page-title { margin: 28px 0 8px; color: #29251f; font-size: clamp(30px, 4vw, 44px); line-height: 1.18; }
    .page-subtitle { margin: 0 0 28px; color: var(--muted); font-size: 19px; }
    .panel {
      margin-top: 18px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .panel-title-row, .section-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; }
    .panel h2, .section-title { margin: 0; color: #25231f; font-size: 25px; }
    .panel-note { margin: 0; color: var(--muted); font-size: 16px; }

    .quality-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .quality-tab {
      min-width: 106px;
      padding: 11px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #765d40;
      background: #fffdf7;
      font-weight: 800;
    }
    .quality-tab.is-active { color: #fff; background: var(--purple); border-color: var(--purple); }
    .quality-tab.quality-橙 { color: #c6711f; }
    .quality-tab.quality-红 { color: #bb4d63; }
    .quality-tab.quality-金 { color: #ae7b1a; }
    .quality-tab.quality-暗金 { color: #7d5b29; }
    .quality-tab.quality-白金 { color: #587d8e; }
    .quality-tab.quality-琉金, .quality-tab.quality-澜金 { color: #4d7894; }
    .quality-tab.is-active { color: #fff; }
    .pet-list-heading { display: flex; align-items: center; gap: 12px; margin: 18px 0 10px; }
    .quality-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      height: 34px;
      padding: 0 10px;
      border-radius: 8px;
      color: #fff;
      background: var(--purple);
      font-weight: 900;
    }
    .quality-badge.quality-橙 { background: #d9822b; }
    .quality-badge.quality-红 { background: #c15063; }
    .quality-badge.quality-金 { color: #fff8d8; background: #b38b22; }
    .quality-badge.quality-暗金 { color: #fff0c2; background: #77603e; }
    .quality-badge.quality-白金 { color: #eef9ff; background: #668ea0; }
    .quality-badge.quality-琉金, .quality-badge.quality-澜金 { color: #fff; background: #678aa5; }
    .pet-list-heading strong { font-size: 19px; }
    .pet-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .pet-option {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 76px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-left: 6px solid var(--purple);
      border-radius: 12px;
      color: var(--ink);
      background: var(--panel-soft);
      text-align: left;
    }
    .pet-option:hover, .pet-option.is-selected { background: var(--purple-soft); box-shadow: 0 0 0 2px rgba(123, 91, 187, .16); }
    .pet-option.quality-橙 { border-left-color: #d9822b; }
    .pet-option.quality-红 { border-left-color: #c15063; }
    .pet-option.quality-金 { border-left-color: #b38b22; }
    .pet-option.quality-暗金, .pet-option.quality-白金, .pet-option.quality-琉金, .pet-option.quality-澜金 { border-left-color: #678aa5; }
    .pet-option img { width: 54px; height: 54px; object-fit: contain; border-radius: 10px; }
    .pet-option strong { display: block; font-size: 18px; }
    .pet-option small { display: block; margin-top: 3px; color: var(--muted); }
    .empty-state { margin: 14px 0 0; color: var(--muted); }

    .profile { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 24px; align-items: center; }
    .profile-art { display: grid; place-items: center; min-height: 190px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-soft); }
    .profile-art img { width: 100%; max-height: 190px; object-fit: contain; }
    .profile-main h2 { display: inline; color: var(--gold); font-size: 30px; }
    .profile-main .quality-badge { margin-left: 12px; vertical-align: 5px; }
    .profile-description { margin: 10px 0 16px; color: var(--muted); line-height: 1.65; }
    .profile-facts { display: flex; flex-wrap: wrap; gap: 10px 22px; color: #40382f; font-weight: 700; }
    .profile-facts span { white-space: nowrap; }
    .base-attributes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .attribute-chip { padding: 9px 13px; border: 1px solid #e7c98a; border-radius: 10px; color: var(--gold); background: #fffaf0; font-weight: 800; }

    .calculator-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .calculator-card { padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-soft); }
    .calculator-card h3 { margin: 0; font-size: 22px; }
    .calculator-card .card-note { margin: 6px 0 17px; color: var(--muted); }
    .control-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
    .control-row label { display: grid; gap: 6px; color: var(--muted); font-weight: 800; }
    .control-row input {
      width: 100%;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: #fff;
      font-size: 20px;
      font-weight: 800;
    }
    .arrow { color: var(--gold); font-size: 30px; }
    .result-block { margin-top: 18px; }
    .result-label { margin: 0 0 8px; color: var(--muted); font-size: 14px; font-weight: 800; }
    .material-list { display: flex; flex-wrap: wrap; gap: 10px 16px; min-height: 42px; }
    .material-item { display: inline-flex; align-items: center; gap: 8px; color: #25221d; font-weight: 800; }
    .material-item img { width: 38px; height: 38px; object-fit: contain; }
    .material-item .amount { color: var(--ink); }
    .attribute-list { display: flex; flex-wrap: wrap; gap: 9px 16px; }
    .attribute-line { font-weight: 800; }
    .attribute-line .current { color: var(--gold); }
    .attribute-line .gain { color: var(--green); }
    .attribute-line .zero { color: var(--muted); }
    .hint { color: var(--muted); }

    details { margin-top: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); overflow: hidden; }
    details > summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 22px; list-style: none; cursor: pointer; font-size: 24px; font-weight: 900; }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::after { content: "▾"; color: var(--green); font-size: 20px; transition: transform .15s ease; }
    details:not([open]) > summary::after { transform: rotate(-90deg); }
    .detail-content { padding: 0 22px 22px; }
    .detail-table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 720px; }
    th, td { padding: 14px 12px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); background: #fff4db; font-size: 15px; }
    td:first-child { color: var(--gold); font-weight: 900; white-space: nowrap; }
    .compact-materials { display: flex; flex-wrap: wrap; gap: 8px 15px; }
    .compact-material { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 700; }
    .compact-material img { width: 32px; height: 32px; object-fit: contain; }
    .description-list { display: grid; gap: 12px; }
    .description-line { padding: 12px 14px; border-left: 4px solid var(--green); color: #4c4a42; background: #fbf4e7; line-height: 1.6; }
    .footer { margin-top: 35px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); line-height: 1.7; }

    @media (max-width: 820px) {
      .shell { width: min(100% - 24px, 680px); padding-top: 14px; }
      .site-header { min-height: 78px; gap: 12px; }
      .brand-mark { width: 94px; }
      .brand-name { font-size: 19px; }
      .back-link { padding: 9px 13px; border-radius: 10px; font-size: 14px; }
      .page-title { margin-top: 22px; font-size: 30px; }
      .page-subtitle { font-size: 16px; }
      .panel { padding: 17px; border-radius: 12px; }
      .panel-title-row, .section-title-row { display: block; }
      .panel-note { margin-top: 8px; }
      .pet-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .profile { grid-template-columns: 130px minmax(0, 1fr); gap: 16px; }
      .profile-art { min-height: 130px; }
      .profile-art img { max-height: 130px; }
      .profile-main h2 { font-size: 25px; }
      .calculator-grid { grid-template-columns: 1fr; }
      details > summary { padding: 17px; font-size: 20px; }
      .detail-content { padding: 0 17px 17px; }
    }
    @media (max-width: 520px) {
      .pet-list { grid-template-columns: 1fr; }
      .profile { grid-template-columns: 1fr; }
      .profile-art { min-height: 180px; }
      .profile-art img { max-height: 180px; }
      .control-row { grid-template-columns: 1fr 28px 1fr; }
      .control-row input { font-size: 18px; }
      .arrow { font-size: 23px; }
    }
  </style>

  <script defer src="assets/table-attribute-standard.js"></script>
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <img class="brand-mark" src="assets/fangsan-logo.png" alt="放开那三国">
      <p class="brand-name">放三数据合集</p>
      <a class="back-link" href="upgrade-materials.html">返回入口</a>
    </header>

    <h1 class="page-title">宠物属性与升星</h1>
    <p class="page-subtitle">选择宠物，查看基础属性、升星消耗与可获得属性</p>

    <section class="panel" aria-labelledby="pet-picker-title">
      <div class="panel-title-row">
        <h2 id="pet-picker-title">按品质选择宠物</h2>
        <p class="panel-note">品质页签选中后再显示对应宠物</p>
      </div>
      <div id="qualityTabs" class="quality-tabs" role="tablist" aria-label="宠物品质"></div>
      <div id="petListHeading" class="pet-list-heading"></div>
      <div id="petList" class="pet-list"></div>
    </section>

    <section id="profilePanel" class="panel" aria-labelledby="profileTitle"></section>

    <section class="panel" aria-labelledby="calculatorTitle">
      <div class="section-title-row">
        <h2 class="section-title" id="calculatorTitle">宠物培养计算器</h2>
        <p class="panel-note">按当前宠物汇总材料和全体属性</p>
      </div>
      <div class="calculator-grid">
        <section class="calculator-card" aria-labelledby="starCalculatorTitle">
          <h3 id="starCalculatorTitle">升星计算器</h3>
          <p class="card-note">0星表示未升星</p>
          <div class="control-row">
            <label>从星级<input id="starFrom" type="number" min="0" max="5" value="0"></label>
            <span class="arrow" aria-hidden="true">→</span>
            <label>到星级<input id="starTo" type="number" min="0" max="5" value="5"></label>
          </div>
          <div id="starMaterials" class="result-block"></div>
          <div id="starAttributes" class="result-block"></div>
        </section>
        <section id="evolveCalculator" class="calculator-card" aria-labelledby="evolveCalculatorTitle">
          <h3 id="evolveCalculatorTitle">进阶计算器</h3>
          <p class="card-note">0阶表示未进阶</p>
          <div class="control-row">
            <label>从阶数<input id="evolveFrom" type="number" min="0" value="0"></label>
            <span class="arrow" aria-hidden="true">→</span>
            <label>到阶数<input id="evolveTo" type="number" min="0" value="5"></label>
          </div>
          <div id="evolveMaterials" class="result-block"></div>
          <div id="evolveAttributes" class="result-block"></div>
        </section>
      </div>
    </section>

    <details>
      <summary>宠物技能与基础资料</summary>
      <div id="petDetails" class="detail-content"></div>
    </details>

    <details>
      <summary>宠物升星材料与属性</summary>
      <div id="starTable" class="detail-content"></div>
    </details>

    <details id="evolveDetails">
      <summary>宠物进阶材料与属性</summary>
      <div id="evolveTable" class="detail-content"></div>
    </details>

    <footer class="footer">数据来源于本地游戏资源表，仅用于资料整理与交流展示。</footer>
  </main>

  <script src="assets/pet-data.js"></script>
  <script>
    (() => {
      const data = window.petData;
      const pets = data.pets;
      const petById = new Map(pets.map(pet => [pet.id, pet]));
      const state = { quality: pets[0].qualityName, petId: pets[0].id };
      const $ = id => document.getElementById(id);
      const qualityClass = name => `quality-${name}`;
      const iconPath = (folder, fileName) => `assets/${folder}/${fileName}`;
      const formatNumber = value => Number(value || 0).toLocaleString('en-US');
      const formatSilver = value => {
        const number = Number(value || 0);
        if (number >= 10000) return `${Number((number / 10000).toFixed(2))}w`;
        return formatNumber(number);
      };
      const clampInput = (input, fallback, max) => {
        const value = Number(input.value);
        const next = Number.isFinite(value) ? Math.max(0, Math.min(max, value)) : fallback;
        input.value = next;
        return next;
      };

      function materialIcon(itemId, pet) {
        if (Number(itemId) === 0) return 'assets/lingdi-items/yinbi.png';
        if (Number(itemId) === 60044) return 'assets/pet-evolve/lianguteng.png';
        if (pet.fragment && Number(itemId) === Number(pet.fragment.id)) return iconPath('pet-icons', pet.fragment.icon);
        return iconPath('pet-icons', pet.icon);
      }

      function materialName(itemId, pet) {
        if (Number(itemId) === 0) return '银币';
        if (Number(itemId) === 60044) return '炼骨藤精华';
        if (pet.fragment && Number(itemId) === Number(pet.fragment.id)) return pet.fragment.name;
        return `材料${itemId}`;
      }

      function materialNode(itemId, amount, pet) {
        const label = materialName(itemId, pet);
        const number = Number(itemId) === 0 ? formatSilver(amount) : formatNumber(amount);
        const item = document.createElement('span');
        item.className = 'material-item';
        item.innerHTML = `<img src="${materialIcon(itemId, pet)}" alt=""><span>${label} <span class="amount">×${number}</span></span>`;
        return item;
      }

      function setResult(container, title, children) {
        container.replaceChildren();
        const label = document.createElement('p');
        label.className = 'result-label';
        label.textContent = title;
        const list = document.createElement('div');
        list.className = 'material-list';
        children.forEach(child => list.append(child));
        container.append(label, list);
      }

      function parseRange(fromInput, toInput, max) {
        const from = clampInput(fromInput, 0, max);
        const to = Math.max(from, clampInput(toInput, max, max));
        toInput.value = to;
        return { from, to };
      }

      function aggregateMaterials(rows, pet) {
        const totals = new Map();
        rows.forEach(row => (row.materials || [row]).forEach(material => {
          const itemId = Number(material.itemId);
          totals.set(itemId, (totals.get(itemId) || 0) + Number(material.amount || 0));
        }));
        return [...totals.entries()].map(([itemId, amount]) => materialNode(itemId, amount, pet));
      }

      function aggregateAttributes(baseAttributes, additions) {
        const values = new Map(baseAttributes.map(attribute => [Number(attribute.attributeId), { name: attribute.name, current: Number(attribute.amount || 0), gain: 0 }]));
        additions.forEach(attribute => {
          const id = Number(attribute.attributeId);
          const row = values.get(id) || { name: attribute.name, current: 0, gain: 0 };
          row.gain += Number(attribute.amount || 0);
          values.set(id, row);
        });
        return [...values.values()];
      }

      function renderAttributes(container, baseAttributes, additions) {
        container.replaceChildren();
        const label = document.createElement('p');
        label.className = 'result-label';
        label.textContent = '获得全体属性';
        const list = document.createElement('div');
        list.className = 'attribute-list';
        aggregateAttributes(baseAttributes, additions).forEach(attribute => {
          const line = document.createElement('span');
          line.className = 'attribute-line';
          const current = document.createElement('span');
          current.className = attribute.current ? 'current' : 'zero';
          current.textContent = formatNumber(attribute.current);
          const gain = document.createElement('span');
          gain.className = 'gain';
          gain.textContent = `+${formatNumber(attribute.gain)}`;
          line.append(document.createTextNode(`${attribute.name} `), current, document.createTextNode(' '), gain);
          list.append(line);
        });
        container.append(label, list);
      }

      function renderQualityTabs() {
        const tabs = $('qualityTabs');
        const qualities = [...new Set(pets.map(pet => pet.qualityName))];
        tabs.replaceChildren();
        qualities.forEach(quality => {
          const tab = document.createElement('button');
          tab.type = 'button';
          tab.className = `quality-tab ${qualityClass(quality)}${quality === state.quality ? ' is-active' : ''}`;
          tab.setAttribute('role', 'tab');
          tab.setAttribute('aria-selected', String(quality === state.quality));
          tab.textContent = `${quality}品质`;
          tab.addEventListener('click', () => {
            state.quality = quality;
            const first = pets.find(pet => pet.qualityName === quality);
            if (first) state.petId = first.id;
            renderAll();
          });
          tabs.append(tab);
        });
      }

      function renderPetList() {
        const list = $('petList');
        const heading = $('petListHeading');
        const visiblePets = pets.filter(pet => pet.qualityName === state.quality);
        const headingBadge = document.createElement('span');
        headingBadge.className = `quality-badge ${qualityClass(state.quality)}`;
        headingBadge.textContent = state.quality;
        heading.replaceChildren(headingBadge, document.createTextNode(`${state.quality}品质宠物`));
        list.replaceChildren();
        visiblePets.forEach(pet => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `pet-option ${qualityClass(pet.qualityName)}${pet.id === state.petId ? ' is-selected' : ''}`;
          button.innerHTML = `<img src="${iconPath('pet-icons', pet.icon)}" alt=""><span><strong>${pet.name}</strong><small>等级上限 ${pet.levelLimit}级 · ${pet.columnLimit}个技能栏</small></span>`;
          button.addEventListener('click', () => { state.petId = pet.id; renderAll(); });
          list.append(button);
        });
      }

      function renderProfile(pet) {
        const profile = $('profilePanel');
        const base = pet.baseAttributes.map(attribute => `<span class="attribute-chip">${attribute.name} +${formatNumber(attribute.amount)}</span>`).join('');
        profile.innerHTML = `
          <div class="profile">
            <div class="profile-art"><img src="${iconPath('pet-bodies', pet.model)}" alt="${pet.name}"></div>
            <div class="profile-main">
              <h2 id="profileTitle">${pet.name}</h2><span class="quality-badge ${qualityClass(pet.qualityName)}">${pet.qualityName}</span>
              <p class="profile-description">${pet.description || '暂无描述'}</p>
              <div class="profile-facts">
                <span>强化等级：0级至${pet.levelLimit}级</span>
                <span>技能栏位：${pet.columnLimit}</span>
                <span>初始领悟点：${formatNumber(pet.graspOrigin)}</span>
              </div>
              <div class="base-attributes">${base || '<span class="hint">暂无基础属性</span>'}</div>
            </div>
          </div>`;
        const profileImage = profile.querySelector('.profile-art img');
        profileImage.addEventListener('error', () => {
          profileImage.src = iconPath('pet-icons', pet.icon);
        }, { once: true });
      }

      function renderStarCalculator(pet) {
        const max = 5;
        const star = pet.stars;
        if (!star) {
          setResult($('starMaterials'), '消耗材料', [Object.assign(document.createElement('span'), { className: 'hint', textContent: '当前宠物暂无升星配置' })]);
          $('starAttributes').replaceChildren();
          return;
        }
        const range = parseRange($('starFrom'), $('starTo'), max);
        const rows = star.costs.filter(row => row.star > range.from && row.star <= range.to);
        setResult($('starMaterials'), '消耗材料', aggregateMaterials(rows, pet));
        const additions = star.attributes.filter(attribute => attribute.star > range.from && attribute.star <= range.to);
        renderAttributes($('starAttributes'), pet.baseAttributes, additions);
      }

      function renderEvolveCalculator(pet) {
        const card = $('evolveCalculator');
        const details = $('evolveDetails');
        if (!pet.evolve) {
          card.hidden = true;
          details.hidden = true;
          return;
        }
        card.hidden = false;
        details.hidden = false;
        const max = pet.evolve.maxLevel;
        $('evolveFrom').max = max;
        $('evolveTo').max = max;
        const range = parseRange($('evolveFrom'), $('evolveTo'), max);
        const rows = pet.evolve.levelCosts.filter(row => row.level > range.from && row.level <= range.to);
        setResult($('evolveMaterials'), '消耗材料', aggregateMaterials(rows, pet));
        const additions = pet.evolve.attributes.filter(attribute => attribute.level > range.from && attribute.level <= range.to);
        renderAttributes($('evolveAttributes'), pet.baseAttributes, additions);
      }

      function renderPetDetails(pet) {
        const lines = [pet.normalDescription, pet.talentDescription, pet.specialDescription].filter(Boolean);
        const fragment = pet.fragment ? `${pet.fragment.name}，合成需要 ${pet.fragment.needPartNum || '—'} 个` : '暂无碎片配置';
        $('petDetails').innerHTML = `<div class="description-list">${lines.map(line => `<div class="description-line">${line.replace(/\n/g, '<br>')}</div>`).join('')}<div class="description-line">${fragment}</div></div>`;
      }

      function compactMaterials(materials, pet) {
        return materials.map(material => `<span class="compact-material"><img src="${materialIcon(material.itemId, pet)}" alt="">${materialName(material.itemId, pet)} ×${Number(material.itemId) === 0 ? formatSilver(material.amount) : formatNumber(material.amount)}</span>`).join('');
      }

      function renderStarTable(pet) {
        if (!pet.stars) {
          $('starTable').innerHTML = '<p class="hint">当前宠物暂无升星材料与属性配置。</p>';
          return;
        }
        const rows = pet.stars.costs.map(cost => {
          const attr = pet.stars.attributes.find(item => item.star === cost.star);
          const materials = [{ itemId: cost.itemId, amount: cost.amount }];
          return `<tr><td>${cost.star - 1}星 → ${cost.star}星</td><td><div class="compact-materials">${compactMaterials(materials, pet)}</div></td><td>${attr ? `${attr.name} +${formatNumber(attr.amount)}` : '—'}</td></tr>`;
        }).join('');
        $('starTable').innerHTML = `<div class="detail-table-wrap"><table><thead><tr><th>升星区间</th><th>消耗材料</th><th>升星效果</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }

      function renderEvolveTable(pet) {
        if (!pet.evolve) {
          $('evolveTable').innerHTML = '<p class="hint">当前宠物暂无进阶配置。</p>';
          return;
        }
        const rows = pet.evolve.levelCosts.map(cost => {
          const attrs = pet.evolve.attributes.filter(attribute => attribute.level === cost.level).map(attribute => `${attribute.name} +${formatNumber(attribute.amount)}`).join('，');
          return `<tr><td>${cost.level - 1}阶 → ${cost.level}阶</td><td><div class="compact-materials">${compactMaterials(cost.materials, pet)}</div></td><td>${attrs || '—'}</td></tr>`;
        }).join('');
        $('evolveTable').innerHTML = `<div class="detail-table-wrap"><table><thead><tr><th>进阶区间</th><th>消耗材料</th><th>进阶效果</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }

      function renderAll() {
        const pet = petById.get(state.petId) || pets[0];
        state.quality = pet.qualityName;
        renderQualityTabs();
        renderPetList();
        renderProfile(pet);
        renderStarCalculator(pet);
        renderEvolveCalculator(pet);
        renderPetDetails(pet);
        renderStarTable(pet);
        renderEvolveTable(pet);
      }

      ['starFrom', 'starTo', 'evolveFrom', 'evolveTo'].forEach(id => $(id).addEventListener('input', () => renderAll()));
      renderAll();
    })();
  </script>
</body>
</html>
