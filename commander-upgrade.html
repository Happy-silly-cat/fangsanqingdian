<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="放三统帅强化材料与等级属性查询表。">
  <title>统帅属性与材料 - 放三数据合集</title>
  <link rel="icon" type="image/png" href="assets/fangsan-logo.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe5;
      --panel: #fff8ec;
      --panel-strong: #fffdf8;
      --panel-hover: #fff3dc;
      --text: #27231e;
      --muted: #746d62;
      --line: #d9cbb6;
      --jade: #3c9d85;
      --jade-dark: #173f35;
      --gold: #b8842f;
      --purple: #76519d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    a { color: inherit; }

    .shell {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 20px 0 32px;
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 52px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }

    .brand-mark {
      display: block;
      width: 118px;
      height: auto;
      flex: 0 0 118px;
      object-fit: contain;
      filter: drop-shadow(0 5px 14px rgba(0, 0, 0, 0.22));
    }

    .brand-copy { min-width: 0; flex: 1 1 auto; }
    .brand-name { margin: 0; font-size: 19px; line-height: 1.25; font-weight: 750; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .intro {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin: 14px 0 12px;
    }

    .page-title {
      margin: 0;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 850;
    }

    .page-note,
    .section-meta,
    .summary-meta {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .picker-panel,
    .summary-panel,
    .section-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .picker-panel { padding: 14px 16px 16px; }

    .panel-heading,
    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
    }

    .section-title {
      margin: 0;
      color: var(--jade-dark);
      font-size: 18px;
      line-height: 1.3;
      font-weight: 850;
    }

    .commander-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .commander-card {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      min-height: 76px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: var(--panel-strong);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      text-align: left;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .commander-card:hover,
    .commander-card:focus-visible,
    .commander-card.is-active {
      border-color: var(--jade);
      background: var(--panel-hover);
      box-shadow: 0 7px 16px rgba(60, 157, 133, 0.14);
      outline: none;
    }

    .commander-card:hover { transform: translateY(-2px); }

    .commander-card-icon {
      display: block;
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      object-fit: contain;
      filter: drop-shadow(0 3px 5px rgba(75, 32, 32, 0.2));
    }

    .commander-card-copy { min-width: 0; }
    .commander-card-name { display: block; font-size: 15px; line-height: 1.35; font-weight: 850; }
    .commander-card-meta { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.3; }

    .summary-panel {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
      padding: 13px 16px;
    }

    .summary-icon {
      display: block;
      width: 84px;
      height: 84px;
      flex: 0 0 84px;
      object-fit: contain;
      filter: drop-shadow(0 4px 7px rgba(75, 32, 32, 0.2));
    }

    .summary-main { min-width: 0; flex: 1 1 auto; }
    .summary-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .summary-title { margin: 0; color: var(--jade-dark); font-size: 20px; line-height: 1.3; font-weight: 850; }

    .summary-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 9px;
    }

    .summary-stat {
      display: inline-flex;
      align-items: center;
      min-height: 29px;
      border: 1px solid rgba(184, 132, 47, 0.28);
      border-radius: 7px;
      padding: 4px 9px;
      background: var(--panel-strong);
      color: var(--gold);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .calculator-panel {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px 16px;
      background: var(--panel);
    }

    .calculator-body {
      display: grid;
      grid-template-columns: minmax(360px, 0.95fr) minmax(0, 1.05fr);
      align-items: center;
      gap: 18px;
      margin-top: 11px;
    }

    .calculator-fields {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr);
      align-items: center;
      gap: 9px;
      width: 100%;
    }

    .calculator-field {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      width: 100%;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
    }

    .level-input {
      width: 100%;
      min-width: 0;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 5px 8px;
      background: var(--panel-strong);
      color: var(--text);
      font: inherit;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .level-input:focus-visible {
      outline: 3px solid rgba(60, 157, 133, 0.3);
      outline-offset: 1px;
      border-color: var(--jade);
    }

    .calculator-arrow {
      color: var(--jade);
      font-size: 25px;
      font-weight: 850;
      line-height: 1;
      text-align: center;
    }

    .calculator-result {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      width: 100%;
      text-align: right;
    }

    .calculator-result-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .calculator-result-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .calculator-costs {
      display: flex;
      flex-wrap: nowrap;
      justify-content: flex-end;
      gap: 8px 16px;
      margin-top: 8px;
      overflow-x: auto;
      width: 100%;
    }

    .calculator-cost-chip {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 5px;
      min-height: 34px;
      color: var(--text);
      font-size: 14px;
      font-weight: 750;
      white-space: nowrap;
    }

    .calculator-cost-chip img {
      display: block;
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .calculator-cost-chip strong {
      color: var(--gold);
      font-size: 18px;
      font-variant-numeric: tabular-nums;
    }

    .calculator-attributes {
      display: flex;
      flex-wrap: nowrap;
      align-items: baseline;
      gap: 3px 12px;
      width: 100%;
      margin-top: 10px;
      border: 1px solid rgba(217, 203, 182, 0.9);
      border-radius: 7px;
      overflow-x: auto;
      padding: 10px;
      background: var(--panel-strong);
      color: var(--jade-dark);
      font-size: 13px;
      line-height: 1.45;
      white-space: nowrap;
    }

    .calculator-attribute-title {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      min-height: 23px;
      border: 1px solid currentColor;
      border-radius: 5px;
      padding: 0 7px;
      color: #9b6f1f;
      background: #fff2cf;
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }

    .calculator-attribute-list {
      display: flex;
      flex-wrap: nowrap;
      gap: 5px 12px;
      margin-top: 0;
      white-space: nowrap;
    }

    .calculator-attribute-line {
      flex: 0 0 auto;
      font-weight: 800;
    }

    .calculator-attribute-line.is-note { color: var(--muted); font-weight: 600; }

    .section-panel { margin-top: 12px; padding: 14px 16px 16px; }
    .table-wrap { margin-top: 10px; overflow-x: auto; }

    .collapsible-panel {
      overflow: hidden;
      padding: 0;
    }

    .collapsible-summary {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 14px 16px;
      cursor: pointer;
      list-style: none;
    }

    .collapsible-summary::-webkit-details-marker { display: none; }

    .collapsible-summary::before {
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 7px solid var(--jade);
      content: "";
      flex: 0 0 auto;
      transition: transform 160ms ease;
    }

    .collapsible-panel[open] > .collapsible-summary::before { transform: rotate(90deg); }

    .collapsible-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
    }

    .collapsible-panel > .table-wrap {
      margin-top: 0;
      border-top: 1px solid var(--line);
      padding: 0 16px 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      vertical-align: middle;
      text-align: left;
    }

    th {
      background: rgba(217, 203, 182, 0.24);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    tbody tr:last-child td { border-bottom: 0; }
    .number { color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .material-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
      margin-top: 11px;
    }

    .material-card {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      min-height: 66px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 8px;
      background: var(--panel-strong);
    }

    .material-icon {
      display: block;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(75, 32, 32, 0.16));
    }

    .material-copy { min-width: 0; }
    .material-name { display: block; font-size: 13px; line-height: 1.35; font-weight: 800; overflow-wrap: anywhere; }
    .material-detail { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; line-height: 1.35; }

    .cost-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      min-width: 310px;
    }

    .cost-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text);
      white-space: nowrap;
    }

    .cost-chip img {
      display: block;
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .cost-chip strong { color: var(--gold); font-weight: 800; }

    .attribute-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      min-width: 220px;
    }

    .attribute-item {
      color: var(--jade-dark);
      font-weight: 750;
      white-space: nowrap;
    }

    .talent-effect {
      min-width: 250px;
      max-width: 650px;
      color: var(--muted);
      line-height: 1.6;
    }

    .talent-node > strong {
      display: block;
      margin-bottom: 3px;
      color: var(--gold);
      font-size: 12px;
    }

    .talent-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 3px;
    }

    .talent-tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 5px;
      padding: 2px 7px;
      background: rgba(60, 157, 133, 0.11);
      color: var(--jade-dark);
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }

    .talent-description { margin-top: 3px; }

    .initial-skills {
      display: grid;
      gap: 5px;
      min-width: 280px;
      max-width: 680px;
      color: var(--muted);
      line-height: 1.6;
    }

    .skill-description {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: start;
      gap: 6px;
    }

    .skill-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      border-radius: 4px;
      padding: 1px 4px;
      color: #fff;
      font-size: 12px;
      font-weight: 850;
      line-height: 1.35;
    }

    .skill-label.normal { background: #a436c7; }
    .skill-label.rage { background: #df2a25; }

    .empty { color: var(--muted); }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      margin-top: 26px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    .copyright-note { max-width: 760px; margin: 0; line-height: 1.7; }

    @media (max-width: 820px) {
      .commander-grid { grid-template-columns: repeat(3, minmax(160px, 1fr)); overflow-x: auto; }
      .material-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .shell { width: min(100% - 24px, 1180px); padding-top: 18px; }
      .site-header { padding-bottom: 12px; }
      .brand-mark { width: 96px; flex-basis: 96px; }
      .brand-name { font-size: 17px; }
      .back-link { padding: 7px 9px; font-size: 12px; }
      .intro { display: block; margin-top: 18px; }
      .page-title { font-size: 25px; }
      .page-note { margin-top: 5px; }
      .picker-panel, .section-panel { padding: 12px 11px 13px; }
      .collapsible-panel { padding: 0; }
      .collapsible-summary { padding: 12px 11px; }
      .collapsible-heading { align-items: flex-start; flex-direction: column; gap: 3px; }
      .collapsible-panel > .table-wrap { padding: 0 11px 13px; }
      .summary-panel { gap: 10px; padding: 11px; }
      .summary-icon { width: 66px; height: 66px; flex-basis: 66px; }
      .summary-title { font-size: 18px; }
      .summary-stats { gap: 6px; margin-top: 7px; }
      .summary-stat { padding: 3px 7px; font-size: 11px; }
      .calculator-panel { padding: 12px 11px 13px; }
      .calculator-body { grid-template-columns: 1fr; gap: 13px; }
      .calculator-fields { grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr); }
      .calculator-result { border-top: 1px solid var(--line); padding: 13px 0 0; }
      .commander-grid { gap: 7px; margin-top: 10px; }
      .commander-card { min-height: 66px; padding: 6px; gap: 6px; }
      .commander-card-icon { width: 44px; height: 44px; flex-basis: 44px; }
      .commander-card-name { font-size: 13px; }
      .commander-card-meta { font-size: 11px; }
      .material-strip { gap: 7px; }
      .material-card { min-height: 58px; padding: 6px; gap: 6px; }
      .material-icon { width: 36px; height: 36px; flex-basis: 36px; }
      .material-name { font-size: 12px; }
      th, td { padding: 8px 7px; }
      .cost-list, .attribute-list { min-width: 180px; }
      .talent-effect { min-width: 220px; }
      footer { align-items: flex-start; flex-direction: column; gap: 12px; }
    }
  </style>
  <link rel="stylesheet" href="assets/table-attribute-standard.css?v=20260919">
  <script defer src="assets/table-attribute-standard.js"></script>
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <img class="brand-mark" src="assets/fangsan-logo.png" alt="放开那三国">
      <div class="brand-copy">
        <p class="brand-name">放三数据合集</p>
      </div>
      <a class="back-link" href="upgrade-materials.html">返回升级材料</a>
    </header>

    <div class="intro">
      <h1 class="page-title">统帅属性与材料</h1>
      <p class="page-note">查看统帅强化消耗和等级属性节点</p>
    </div>

    <section class="picker-panel" aria-labelledby="commander-picker-title">
      <div class="panel-heading">
        <h2 class="section-title" id="commander-picker-title">选择统帅</h2>
        <p class="section-meta">最高强化等级 50 级</p>
      </div>
      <div class="commander-grid" id="commander-grid"></div>
    </section>

    <section class="summary-panel" aria-live="polite">
      <img class="summary-icon" id="summary-icon" src="" alt="">
      <div class="summary-main">
        <div class="summary-heading">
          <h2 class="summary-title" id="summary-title"></h2>
          <p class="summary-meta" id="summary-meta"></p>
        </div>
        <div class="summary-stats" id="summary-stats"></div>
      </div>
    </section>

    <section class="calculator-panel" aria-labelledby="calculator-title">
      <div class="section-heading">
        <h2 class="section-title" id="calculator-title">升级计算器</h2>
        <p class="section-meta">每级强化都会增加基础属性，等级节点另有额外效果</p>
      </div>
      <div class="calculator-body">
        <div class="calculator-fields">
          <label class="calculator-field" for="from-level-input">
            从
            <input class="level-input" id="from-level-input" type="number" min="0" max="50" step="1" value="0" aria-label="起始等级">
            级
          </label>
          <span class="calculator-arrow" aria-hidden="true">&#8594;</span>
          <label class="calculator-field" for="to-level-input">
            到
            <input class="level-input" id="to-level-input" type="number" min="0" max="50" step="1" value="50" aria-label="目标等级">
            级
          </label>
        </div>
        <div class="calculator-result" id="calculator-result" aria-live="polite">
          <div class="calculator-costs" id="calculator-costs"></div>
        </div>
      </div>
      <div class="calculator-attributes" id="calculator-attributes">
        <span class="calculator-attribute-title">获得属性</span>
        <div class="calculator-attribute-list" id="calculator-attribute-list"></div>
      </div>
    </section>

    <details class="section-panel collapsible-panel">
      <summary class="collapsible-summary">
        <span class="collapsible-heading">
          <span class="section-title">解锁、强化与等级效果</span>
          <span class="section-meta">解锁需统帅碎片，强化石用于逐级升级</span>
        </span>
      </summary>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>强化区间</th><th>消耗材料</th><th>获得属性</th><th>技能与天赋</th></tr>
          </thead>
          <tbody id="upgrade-body"></tbody>
        </table>
      </div>
    </details>

    <footer>

      </p>
    </footer>
  </main>

  <script src="assets/commander-data.js"></script>
  <script>
    (() => {
      const data = window.commanderData;
      const commanders = data.commanders || [];
      const commanderGrid = document.getElementById("commander-grid");
      const summaryIcon = document.getElementById("summary-icon");
      const summaryTitle = document.getElementById("summary-title");
      const summaryMeta = document.getElementById("summary-meta");
      const summaryStats = document.getElementById("summary-stats");
      const fromLevelInput = document.getElementById("from-level-input");
      const toLevelInput = document.getElementById("to-level-input");
      const calculatorResult = document.getElementById("calculator-result");
      const calculatorCosts = document.getElementById("calculator-costs");
      const calculatorAttributes = document.getElementById("calculator-attributes");
      const calculatorAttributeList = document.getElementById("calculator-attribute-list");
      const upgradeBody = document.getElementById("upgrade-body");
      let selectedId = commanders[0] ? commanders[0].id : null;

      const escapeHtml = (value) => String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

      const formatNumber = (value) => Number(value).toLocaleString("zh-CN");

      // 这些属性在配置中按百分之百分比存储，页面按玩家能直接理解的百分比展示。
      const formatAttribute = (attribute) => {
        const percentIds = new Set([56, 57, 58, 59, 60, 61, 237]);
        const value = percentIds.has(attribute.id) ? `${attribute.value / 100}%` : formatNumber(attribute.value);
        return `${escapeHtml(attribute.name)} +${escapeHtml(value)}`;
      };

      const costChip = (item) => `
        <span class="cost-chip" title="${escapeHtml(item.name)}">
          <img src="${escapeHtml(item.icon)}" alt="${escapeHtml(item.name)}">
          <span>${escapeHtml(item.name)}</span><strong>×${formatNumber(item.amount)}</strong>
        </span>`;

      const calculatorCostChip = (item) => `
        <span class="calculator-cost-chip" title="${escapeHtml(item.name)}">
          <img src="${escapeHtml(item.icon)}" alt="${escapeHtml(item.name)}">
          <span>${escapeHtml(item.name)}</span><strong>×${formatNumber(item.amount)}</strong>
        </span>`;

      const renderSkillDescription = (type, description) => `
        <div class="skill-description">
          <span class="skill-label ${type === "rage" ? "rage" : "normal"}">${type === "rage" ? "怒" : "普"}</span>
          <span>${escapeHtml(description || "—")}</span>
        </div>`;

      const renderPicker = () => {
        commanderGrid.innerHTML = commanders.map((commander) => `
          <button class="commander-card${commander.id === selectedId ? " is-active" : ""}" type="button" data-id="${commander.id}" aria-pressed="${commander.id === selectedId}">
            <img class="commander-card-icon" src="${escapeHtml(commander.headIcon)}" alt="${escapeHtml(commander.name)}头像">
            <span class="commander-card-copy">
              <span class="commander-card-name">${escapeHtml(commander.name)}</span>
              <span class="commander-card-meta">激活需 ${formatNumber(commander.activation.amount)} 碎片</span>
            </span>
          </button>`).join("");
        commanderGrid.querySelectorAll("[data-id]").forEach((button) => {
          button.addEventListener("click", () => {
            selectedId = Number(button.dataset.id);
            render();
          });
        });
      };

      const renderSummary = (commander) => {
        summaryIcon.src = commander.headIcon;
        summaryIcon.alt = `${commander.name}头像`;
        summaryTitle.textContent = commander.name;
        summaryMeta.textContent = `最高强化 ${commander.maxLevel} 级`;
        summaryStats.innerHTML = [
          `激活：${commander.activation.name} ×${formatNumber(commander.activation.amount)}`,
          `继承属性 +${formatNumber(commander.heroMaxAttPercent / 100)}%`
        ].map((text) => `<span class="summary-stat">${escapeHtml(text)}</span>`).join("");
      };

      const renderLevelAttributes = (commander) => {
        const attributes = commander.levelAttributes || [];
        if (!attributes.length) return '<span class="empty">未找到逐级属性</span>';
        return `<div class="attribute-list">${attributes.map((attribute) => `<span class="attribute-item">${formatAttribute(attribute)}</span>`).join("")}</div>`;
      };

      const renderStrengthenCosts = (commander) => {
        const talentByLevel = new Map(commander.talents.map((talent) => [talent.level, talent]));
        const renderTalentCell = (talent) => {
          if (!talent) return '<span class="empty">—</span>';
          const attributes = talent.attributes.length
            ? `<div class="attribute-list">${talent.attributes.map((attribute) => `<span class="attribute-item">${formatAttribute(attribute)}</span>`).join("")}</div>`
            : "";
          const effect = renderTalentEffect(talent);
          const details = `${attributes}${effect}` || '<span class="empty">—</span>';
          return `<div class="talent-node"><strong>${talent.level}级节点</strong><div class="talent-effect">${details}</div></div>`;
        };
        const unlockTalent = talentByLevel.get(1);
        const unlockAttributes = [
          `<span class="attribute-item">继承属性 +${formatNumber(commander.heroMaxAttPercent / 100)}%</span>`,
          ...(unlockTalent?.attributes || []).map((attribute) => `<span class="attribute-item">${formatAttribute(attribute)}</span>`)
        ].join("");
        const unlockRow = `
          <tr>
            <td class="number">解锁</td>
            <td><div class="cost-list">${costChip(commander.activation)}</div></td>
            <td><div class="attribute-list">${unlockAttributes}</div></td>
            <td>
              <div class="initial-skills">
                ${renderSkillDescription("normal", commander.normalSkillDescription)}
                ${renderSkillDescription("rage", commander.rageSkillDescription)}
              </div>
            </td>
          </tr>`;
        const strengthenRows = commander.strengthenCosts.map((entry) => `
          <tr>
            <td class="number">${entry.level} → ${entry.level + 1} 级</td>
            <td><div class="cost-list">${entry.costs.map(costChip).join("")}</div></td>
            <td>${renderLevelAttributes(commander)}</td>
            <td>${renderTalentCell(talentByLevel.get(entry.level + 1))}</td>
          </tr>`).join("");
        upgradeBody.innerHTML = unlockRow + strengthenRows;
      };

      const readLevel = (input, fallback) => {
        if (!input.value.trim()) return fallback;
        const value = Number(input.value);
        if (!Number.isFinite(value)) return fallback;
        return Math.min(Number(input.max), Math.max(Number(input.min), Math.trunc(value)));
      };

      const normalizeLevel = (input, fallback) => {
        const level = readLevel(input, fallback);
        input.value = String(level);
        return level;
      };

      const getCalculatorCosts = (commander, fromLevel, toLevel) => {
        const totals = new Map();
        const add = (item, amount) => {
          const current = totals.get(item.id) || { ...item, amount: 0 };
          current.amount += amount;
          totals.set(item.id, current);
        };

        if (fromLevel === 0 && toLevel > 0) {
          add(commander.activation, commander.activation.amount);
        }

        commander.strengthenCosts
          .filter((entry) => entry.level >= Math.max(1, fromLevel) && entry.level < toLevel)
          .forEach((entry) => entry.costs.forEach((item) => add(item, item.amount)));

        return [...totals.values()];
      };

      const getCalculatorAttributes = (commander, fromLevel, toLevel) => {
        const totals = new Map();
        let teamMaxAttribute = 0;
        const nodes = commander.talents.filter((talent) => talent.level > fromLevel && talent.level <= toLevel);
        const levelCount = toLevel - fromLevel;

        // 0 级代表未解锁；跨过解锁节点时，同时获得统帅的基础继承属性。
        if (fromLevel === 0 && toLevel > 0) {
          teamMaxAttribute += Number(commander.heroMaxAttPercent) || 0;
        }

        if (levelCount > 0) {
          (commander.levelAttributes || []).forEach((attribute) => {
          const key = `${attribute.id}:${[56, 57, 58, 59, 60, 61, 237].includes(attribute.id) ? "percent" : "flat"}`;
            const current = totals.get(key) || { ...attribute, value: 0 };
            current.value += attribute.value * levelCount;
            totals.set(key, current);
          });
        }

        nodes.forEach((talent) => {
          talent.attributes.forEach((attribute) => {
            const key = `${attribute.id}:${[56, 57, 58, 59, 60, 61, 237].includes(attribute.id) ? "percent" : "flat"}`;
            const current = totals.get(key) || { ...attribute, value: 0 };
            current.value += attribute.value;
            totals.set(key, current);
          });
          teamMaxAttribute += Number(talent.teamMaxAttribute) || 0;
        });

        return { totals: [...totals.values()], teamMaxAttribute };
      };

      const renderCalculatorAttributes = (commander, fromLevel, toLevel) => {
        const result = getCalculatorAttributes(commander, fromLevel, toLevel);
        const lines = result.totals.map((attribute) => `<span class="calculator-attribute-line">${formatAttribute(attribute)}</span>`);
        if (result.teamMaxAttribute > 0) {
          lines.push(`<span class="calculator-attribute-line">继承属性 +${formatNumber(result.teamMaxAttribute / 100)}%</span>`);
        }
        if (!lines.length) {
          lines.push('<span class="calculator-attribute-line is-note">无新增属性</span>');
        }
        calculatorAttributeList.innerHTML = lines.join("");
        calculatorAttributes.hidden = false;
      };

      const renderCalculator = (commander) => {
        const fromLevel = normalizeLevel(fromLevelInput, 0);
        const toLevel = normalizeLevel(toLevelInput, commander.maxLevel);
        calculatorResult.classList.remove("is-invalid");

        if (fromLevel > toLevel) {
          calculatorCosts.innerHTML = '<span class="empty">起始等级不能高于目标等级</span>';
          calculatorAttributeList.innerHTML = "";
          calculatorAttributes.hidden = true;
          calculatorResult.classList.add("is-invalid");
          return;
        }

        const costs = getCalculatorCosts(commander, fromLevel, toLevel);
        calculatorCosts.innerHTML = costs.length
          ? costs.map(calculatorCostChip).join("")
          : '<span class="empty">无需消耗材料</span>';
        renderCalculatorAttributes(commander, fromLevel, toLevel);
      };

      const renderTalentEffect = (talent) => {
        const tags = [];
        if (talent.talentId) tags.push("天赋节点");
        if (talent.teamMaxAttribute) tags.push(`继承属性 +${formatNumber(talent.teamMaxAttribute / 100)}%`);
        const tagHtml = tags.length ? `<div class="talent-tags">${tags.map((tag) => `<span class="talent-tag">${escapeHtml(tag)}</span>`).join("")}</div>` : "";
        const skillType = talent.rageSkill ? "rage" : "normal";
        const skill = talent.description ? renderSkillDescription(skillType, talent.description) : "";
        return `${tagHtml}${skill}`;
      };

      const render = () => {
        const commander = commanders.find((item) => item.id === selectedId) || commanders[0];
        if (!commander) return;
        renderPicker();
        renderSummary(commander);
        fromLevelInput.max = String(commander.maxLevel);
        toLevelInput.max = String(commander.maxLevel);
        renderStrengthenCosts(commander);
        renderCalculator(commander);
      };

      [fromLevelInput, toLevelInput].forEach((input) => {
        input.addEventListener("input", () => {
          // 允许用户先清空输入框，再输入新的等级；失焦时再恢复默认值或限制范围。
          if (!input.value.trim()) return;
          const commander = commanders.find((item) => item.id === selectedId) || commanders[0];
          renderCalculator(commander);
        });
        input.addEventListener("change", () => {
          const commander = commanders.find((item) => item.id === selectedId) || commanders[0];
          normalizeLevel(input, input === toLevelInput ? commander.maxLevel : 0);
          renderCalculator(commander);
        });
        input.addEventListener("blur", () => {
          const commander = commanders.find((item) => item.id === selectedId) || commanders[0];
          normalizeLevel(input, input === toLevelInput ? commander.maxLevel : 0);
        });
      });

      render();
    })();
  </script>
</body>
</html>
