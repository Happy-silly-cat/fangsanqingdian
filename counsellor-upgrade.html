<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="放三军师升级、属性、军师台与兵鉴材料查询表。">
  <title>军师升级材料与属性 - 放三数据合集</title>
  <link rel="icon" type="image/png" href="assets/fangsan-logo.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe5;
      --panel: #fff8ec;
      --panel-strong: #fffdf8;
      --panel-hover: #fff3dc;
      --text: #27231e;
      --muted: #746d62;
      --line: #d9cbb6;
      --jade: #3c9d85;
      --jade-dark: #173f35;
      --gold: #b8842f;
      --orange: #c8752b;
      --red: #bd4d57;
      --dark-gold: #9a6b31;
      --platinum: #557a97;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
    a { color: inherit; }
    button, input, select { font: inherit; }
    .shell { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 20px 0 34px; }
    .site-header { display: flex; align-items: center; gap: 14px; min-height: 52px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
    .brand-mark { display: block; width: 118px; height: auto; flex: 0 0 118px; filter: drop-shadow(0 5px 14px rgba(0, 0, 0, .22)); }
    .brand-copy { min-width: 0; flex: 1 1 auto; }
    .brand-name { margin: 0; font-size: 19px; line-height: 1.25; font-weight: 750; }
    .back-link { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--panel); text-decoration: none; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .intro { display: flex; align-items: center; gap: 12px; margin: 22px 0 8px; }
    .page-icon { display: block; width: 52px; height: 52px; flex: 0 0 52px; border: 2px solid rgba(184, 132, 47, .5); border-radius: 8px; padding: 3px; background: var(--panel-strong); object-fit: contain; }
    .page-title { margin: 0; font-size: 29px; line-height: 1.2; font-weight: 850; }
    .page-note { margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
    .summary-card, .data-section { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .summary-card { padding: 13px 14px; }
    .summary-card h2 { margin: 0; color: var(--jade-dark); font-size: 16px; line-height: 1.3; }
    .summary-card p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .data-section { margin-top: 16px; padding: 17px 18px 19px; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .section-heading h2 { margin: 0; color: var(--jade-dark); font-size: 20px; line-height: 1.3; }
    .section-heading p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; text-align: right; }
    .calculator-form { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr) minmax(0, .85fr) auto; gap: 12px; align-items: end; }
    .field { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .field select { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: var(--panel-strong); color: var(--text); }
    .field select:focus { outline: 2px solid rgba(60, 157, 133, .35); outline-offset: 1px; border-color: var(--jade); }
    .calculate-button { border: 1px solid var(--jade); border-radius: 8px; padding: 9px 15px; background: var(--jade); color: #fff; font-weight: 800; cursor: pointer; }
    .calculate-button:hover { background: var(--jade-dark); }
    .calculator-result { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 10px; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 13px; }
    .result-box { min-width: 0; border: 1px solid rgba(217, 203, 182, .9); border-radius: 7px; padding: 11px 12px; background: var(--panel-strong); }
    .result-box h3 { margin: 0 0 8px; color: var(--muted); font-size: 12px; font-weight: 800; }
    .result-list, .attribute-list, .material-list { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 14px; min-height: 28px; }
    .result-note { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .material-chip, .attribute-chip { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; color: var(--text); font-size: 13px; white-space: nowrap; }
    .material-chip strong, .attribute-chip strong { color: var(--gold); font-weight: 850; font-variant-numeric: tabular-nums; }
    .material-mark { display: inline-grid; place-items: center; width: 27px; height: 27px; border: 1px solid #dbc38f; border-radius: 6px; background: #fff2c9; color: #926522; font-size: 12px; font-weight: 850; overflow: hidden; }
    .material-mark[hidden] { display: none; }
    .material-image { display: block; width: 27px; height: 27px; flex: 0 0 27px; border: 0; border-radius: 0; background: transparent; object-fit: contain; }
    .arm-icon img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .attribute-chip::before { content: "＋"; color: var(--jade); font-weight: 900; }
    .quality { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 7px; font-size: 11px; font-weight: 850; }
    .quality.orange { color: var(--orange); background: #fff0dd; }
    .quality.red { color: var(--red); background: #ffeaec; }
    .quality.gold { color: var(--gold); background: #fff2cf; }
    .quality.dark-gold { color: var(--dark-gold); background: #f4e4c8; }
    .quality.platinum { color: var(--platinum); background: #e8f0f6; }
    .detail-list { display: grid; gap: 8px; }
    .counsellor-detail { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel-strong); }
    .counsellor-summary { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(60, 157, 133, .05); cursor: pointer; list-style: none; }
    .counsellor-summary::-webkit-details-marker { display: none; }
    .counsellor-summary::before { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 7px solid var(--jade); content: ""; transition: transform 160ms ease; }
    .counsellor-detail[open] > .counsellor-summary::before { transform: rotate(90deg); }
    .counsellor-avatar { display: block; width: 46px; height: 46px; flex: 0 0 46px; object-fit: contain; }
    .counsellor-summary-copy { min-width: 0; flex: 1 1 auto; }
    .counsellor-summary h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0; font-size: 16px; line-height: 1.35; }
    .counsellor-summary p { margin: 2px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .summary-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .detail-body { display: grid; gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px 16px; }
    .detail-block h4 { margin: 0 0 7px; color: var(--jade-dark); font-size: 14px; }
    .detail-block-note { margin: -2px 0 8px; color: var(--muted); font-size: 11px; }
    .compact-table, .arm-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .compact-table th, .compact-table td, .arm-table th, .arm-table td { padding: 8px 9px; border-bottom: 1px solid rgba(217, 203, 182, .72); text-align: left; vertical-align: middle; }
    .compact-table th, .arm-table th { background: #f4eadb; color: var(--jade-dark); font-weight: 850; }
    .compact-table tbody tr:last-child td, .arm-table tbody tr:last-child td { border-bottom: 0; }
    .level-label { color: var(--gold); font-weight: 850; white-space: nowrap; }
    .effect-text { line-height: 1.55; }
    .cost-range { color: var(--muted); line-height: 1.55; }
    .cost-range .material-list { align-items: flex-start; gap: 4px 12px; }
    .cost-range .material-chip { font-size: 12px; }
    .cost-range .material-mark { width: 23px; height: 23px; font-size: 11px; }
    .cost-range .material-image { width: 23px; height: 23px; flex-basis: 23px; }
    .altar-items { display: flex; flex-wrap: wrap; gap: 8px 14px; }
    .arm-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .arm-card { border: 1px solid var(--line); border-radius: 7px; padding: 11px 12px; background: var(--panel-strong); }
    .arm-card h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 7px; color: var(--jade-dark); font-size: 15px; }
    .arm-icon { display: inline-grid; place-items: center; width: 34px; height: 34px; flex: 0 0 34px; border: 1px solid #dbc38f; border-radius: 6px; background: #fff2c9; color: #926522; font-size: 13px; font-weight: 850; overflow: hidden; }
    .arm-card p { margin: 4px 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .arm-card .attribute-list { gap: 4px 12px; }
    footer { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    footer p { margin: 0; }
    @media (max-width: 900px) { .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .calculator-form { grid-template-columns: 1fr 1fr; } .calculate-button { width: 100%; } .arm-grid { grid-template-columns: 1fr; } }
    @media (max-width: 680px) { .shell { width: min(100% - 24px, 1180px); padding-top: 16px; } .brand-mark { width: 96px; flex-basis: 96px; } .brand-name { font-size: 17px; } .back-link { padding: 7px 9px; font-size: 12px; } .page-title { font-size: 25px; } .page-icon { width: 44px; height: 44px; flex-basis: 44px; } .summary-grid { gap: 8px; } .summary-card { padding: 11px 12px; } .summary-card h2 { font-size: 15px; } .data-section { padding: 14px 12px 15px; } .section-heading { align-items: flex-start; flex-direction: column; gap: 4px; } .section-heading p { text-align: left; } .calculator-form, .calculator-result { grid-template-columns: 1fr; } .result-note { grid-column: auto; } .summary-meta { display: none; } .detail-body { padding: 12px; } .compact-table, .arm-table { min-width: 650px; } .compact-table-wrap, .arm-table-wrap { overflow-x: auto; } }
  </style>
  <link rel="stylesheet" href="assets/table-attribute-standard.css?v=20260919">
  <script defer src="assets/table-attribute-standard.js"></script>
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <img class="brand-mark" src="assets/fangsan-logo.png" alt="放开那三国">
      <div class="brand-copy"><p class="brand-name">放三数据合集</p></div>
      <a class="back-link" href="upgrade-materials.html">返回升级材料</a>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <!-- 军师头像使用 resource/counsellor/hero/head_icon 的专用头像；新增头像统一放入 assets/counsellor-items。 -->
      <img class="page-icon" src="assets/counsellor-items/junshi_n.png" alt="军师图标" onerror="this.onerror=null;this.src='assets/fangsan-logo.png'">
      <h1 class="page-title" id="page-title">军师升级</h1>
    </section>
    <p class="page-note">查看军师强化、阶段属性、军师技能和军师兵鉴的升级进阶材料。</p>

    <section class="summary-grid" id="summaryGrid" aria-label="军师系统概览"></section>

    <section class="data-section" aria-labelledby="calculator-title">
      <div class="section-heading">
        <h2 id="calculator-title">军师强化计算器</h2>
        <p>按源表逐级累加材料，计算包含起始等级之后的升级。</p>
      </div>
      <div class="calculator-form">
        <label class="field" for="counsellorSelect"><span>选择军师</span><select id="counsellorSelect"></select></label>
        <label class="field" for="startLevel"><span>当前等级</span><select id="startLevel"></select></label>
        <label class="field" for="targetLevel"><span>目标等级</span><select id="targetLevel"></select></label>
        <button class="calculate-button" id="calculateButton" type="button">计算</button>
      </div>
      <div class="calculator-result" aria-live="polite">
        <section class="result-box"><h3>升级材料</h3><div class="result-list" id="calculatorCosts"></div></section>
        <section class="result-box"><h3>新增阶段属性</h3><div class="result-list" id="calculatorAttributes"></div></section>
        <p class="result-note" id="calculatorNote"></p>
      </div>
    </section>

    <section class="data-section" aria-labelledby="altar-title">
      <div class="section-heading">
        <h2 id="altar-title">军师台</h2>
        <p>军师令、军师碎片与阴阳八卦令的来源配置。</p>
      </div>
      <div class="altar-items" id="altarItems"></div>
    </section>

    <section class="data-section" aria-labelledby="counsellor-title">
      <div class="section-heading">
        <h2 id="counsellor-title">军师强化明细</h2>
        <p>共 10 名军师，最高 50 级。</p>
      </div>
      <div class="detail-list" id="counsellorList"></div>
    </section>

    <section class="data-section" aria-labelledby="arm-title">
      <div class="section-heading">
        <h2 id="arm-title">军师兵鉴</h2>
        <p>兵鉴最高 40 级，10、20、30、40 级进行进阶。</p>
      </div>
      <div class="arm-grid" id="armList"></div>
    </section>

    <footer><p>本站为玩家自制的学习交流工具，非官方页面，与游戏官方无关。页面中如使用了游戏内截图、图标或相关素材，仅用于非商业性资料整理与交流展示，相关素材版权归原权利方所有。如有侵权或不当使用，请联系删除。</p></footer>
  </main>

  <!-- 军师新增或材料变更时，统一更新 assets/counsellor-data.js；页面结构无需改动。 -->
  <script src="assets/counsellor-data.js"></script>
  <script>
    const data = window.counsellorData;
    const fmt = (value) => Number(value).toLocaleString('zh-CN');
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const attrName = (id) => data.attributeNames[String(id)] || `属性${id}`;
    const materialInfo = (id) => { const item = data.materials[String(id)] || { name: `材料${id}`, mark: '材' }; return Number(id) === 0 && !item.sourceIcon ? { ...item, sourceIcon: 'jinbi.png' } : item; };
    // 军师材料图标统一从 assets/counsellor-items 读取，缺图时保留文字标记。
    const renderMaterial = (id, amount) => { const item = materialInfo(id); const iconPath = item.sourceIcon ? `assets/counsellor-items/${item.sourceIcon}` : ''; const icon = iconPath ? `<img class="material-image" src="${escapeHtml(iconPath)}" alt="" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="material-mark" aria-hidden="true" hidden>${escapeHtml(item.mark)}</span>` : `<span class="material-mark" aria-hidden="true">${escapeHtml(item.mark)}</span>`; return `<span class="material-chip">${icon}<span>${escapeHtml(item.name)}</span><strong>×${fmt(amount)}</strong></span>`; };
    const renderAttributes = (attributes) => attributes.length ? attributes.map((attribute) => `<span class="attribute-chip"><span>${escapeHtml(attribute.name || attrName(attribute.id))}</span><strong>+${fmt(attribute.amount)}</strong></span>`).join('') : '<span class="result-note">该区间没有新增数值属性节点。</span>';
    const byLevel = (entries) => entries.reduce((map, entry) => { const row = map[entry.level] || (map[entry.level] = []); row.push(entry); return map; }, {});
    const sumCosts = (entries, from, to) => { const totals = new Map(); entries.filter((entry) => entry.level > from && entry.level <= to).forEach((entry) => totals.set(entry.id, (totals.get(entry.id) || 0) + entry.amount)); return [...totals.entries()].map(([id, amount]) => ({ id: Number(id), amount })); };
    const sumMilestoneAttributes = (milestones, from, to) => { const totals = new Map(); milestones.filter((milestone) => milestone.level > from && milestone.level <= to && milestone.effect.kind === 'attribute').forEach((milestone) => milestone.effect.attributes.forEach((attribute) => totals.set(attribute.id, (totals.get(attribute.id) || 0) + attribute.amount))); return [...totals.entries()].map(([id, amount]) => ({ id: Number(id), amount, name: attrName(id) })); };
    const totalAt = (entries, from, to) => entries.filter((entry) => entry.level > from && entry.level <= to).reduce((total, entry) => total + entry.amount, 0);

    const summaryGrid = document.getElementById('summaryGrid');
    const summary = [
      ['军师数量', `${data.counsellors.length} 名军师<br>每名最高 ${data.maxLevel} 级`],
      ['军师台', `每日 ${data.altar.dailyTimes} 次<br>首次免费，之后 ${fmt(data.altar.costOnce)} 军师币/次`],
      ['强化材料', '军师碎片<br>每 5 级额外消耗阴阳八卦令'],
      ['兵鉴', `${data.arms.length} 件兵鉴<br>最高 40 级，4 个进阶节点`]
    ];
    summary.forEach(([title, copy]) => { const card = document.createElement('article'); card.className = 'summary-card'; card.innerHTML = `<h2>${title}</h2><p>${copy}</p>`; summaryGrid.appendChild(card); });

    const altarItems = document.getElementById('altarItems');
    const altarCostItemId = data.altar.costItem && data.altar.costItem.id;
    altarItems.innerHTML = [
      altarCostItemId ? renderMaterial(altarCostItemId, 1) : '',
      ...data.altar.showItems.map((entry) => renderMaterial(entry.id, entry.amount)),
      `<span class="material-chip"><span>抽取次数</span><strong>${data.altar.dailyTimes} 次/日</strong></span>`,
      `<span class="material-chip"><span>单次消耗</span><strong>${fmt(data.altar.costOnce)} 军师币</strong></span>`
    ].join('');

    const counsellorSelect = document.getElementById('counsellorSelect');
    const startLevel = document.getElementById('startLevel');
    const targetLevel = document.getElementById('targetLevel');
    const calculatorCosts = document.getElementById('calculatorCosts');
    const calculatorAttributes = document.getElementById('calculatorAttributes');
    const calculatorNote = document.getElementById('calculatorNote');
    data.counsellors.forEach((counsellor, index) => { counsellorSelect.add(new Option(`${counsellor.name} · ${counsellor.qualityName}`, String(index))); });
    const fillLevels = () => { const c = data.counsellors[Number(counsellorSelect.value)]; startLevel.innerHTML = ''; targetLevel.innerHTML = ''; for (let level = 0; level <= c.maxLevel; level += 1) { startLevel.add(new Option(`${level}级`, String(level))); targetLevel.add(new Option(`${level}级`, String(level))); } startLevel.value = '0'; targetLevel.value = String(c.maxLevel); updateCalculator(); };
    const updateCalculator = () => { const c = data.counsellors[Number(counsellorSelect.value)]; const from = Number(startLevel.value); const to = Number(targetLevel.value); if (to < from) { calculatorCosts.innerHTML = ''; calculatorAttributes.innerHTML = ''; calculatorNote.textContent = '目标等级不能低于当前等级。'; return; } const costs = sumCosts(c.levelCosts, from, to); const attributes = sumMilestoneAttributes(c.milestones, from, to); calculatorCosts.innerHTML = costs.length ? costs.map((cost) => renderMaterial(cost.id, cost.amount)).join('') : '<span class="result-note">无需升级。</span>'; calculatorAttributes.innerHTML = renderAttributes(attributes); const unlocked = c.milestones.filter((milestone) => milestone.level > from && milestone.level <= to); const skills = unlocked.filter((milestone) => milestone.effect.kind === 'skill').length; calculatorNote.textContent = `本次包含 ${to - from} 个等级，${unlocked.length} 个阶段节点${skills ? `，其中 ${skills} 个为军师技能节点` : ''}。`; };
    counsellorSelect.addEventListener('change', fillLevels); startLevel.addEventListener('change', updateCalculator); targetLevel.addEventListener('change', updateCalculator); document.getElementById('calculateButton').addEventListener('click', updateCalculator); fillLevels();

    const counsellorList = document.getElementById('counsellorList');
    data.counsellors.forEach((c) => {
      const grouped = byLevel(c.levelCosts);
      const levelRows = [];
      for (let level = 1; level <= c.maxLevel; level += 1) { const levelCosts = grouped[level] || []; levelRows.push(`<tr><td class="level-label">${level}级</td><td class="cost-range"><div class="material-list">${levelCosts.map((cost) => renderMaterial(cost.id, cost.amount)).join('')}</div></td></tr>`); }
      const milestoneRows = c.milestones.map((milestone) => `<tr><td class="level-label">${milestone.level}级</td><td class="effect-text">${milestone.effect.kind === 'attribute' ? renderAttributes(milestone.effect.attributes) : escapeHtml(milestone.effect.text)}</td></tr>`).join('');
      const activation = c.activation.length ? `<div class="material-list">${c.activation.map((cost) => renderMaterial(cost.id, cost.amount)).join('')}</div>` : '<span class="detail-block-note">源表未单独配置激活消耗。</span>';
      const detail = document.createElement('details'); detail.className = 'counsellor-detail'; detail.innerHTML = `<summary class="counsellor-summary"><img class="counsellor-avatar" src="${c.headIcon}" alt="${escapeHtml(c.name)}头像" onerror="this.onerror=null;this.src='assets/counsellor-items/head_dajishi.png'"><span class="counsellor-summary-copy"><h3>${escapeHtml(c.name)} <span class="quality ${c.qualityClass}">${escapeHtml(c.qualityName)}</span></h3><p>最高 ${c.maxLevel} 级 · 等级效果值 ${c.levelEffectValues.length ? c.levelEffectValues.join(' / ') : '未单独配置'}</p></span><span class="summary-meta">展开查看</span></summary><div class="detail-body"><div class="detail-block"><h4>等级属性</h4><div class="attribute-list">${renderAttributes(c.attributes)}</div></div><div class="detail-block"><h4>激活材料</h4>${activation}</div><div class="detail-block"><h4>阶段属性与技能</h4><div class="compact-table-wrap"><table class="compact-table"><thead><tr><th>达到等级</th><th>新增效果</th></tr></thead><tbody>${milestoneRows}</tbody></table></div></div><div class="detail-block"><h4>每级强化材料</h4><p class="detail-block-note">每一行对应一次升级消耗。</p><div class="compact-table-wrap"><table class="compact-table"><thead><tr><th>升级等级</th><th>材料</th></tr></thead><tbody>${levelRows.join('')}</tbody></table></div></div></div>`; counsellorList.appendChild(detail);
    });

    const armList = document.getElementById('armList');
    data.arms.forEach((arm) => { const totalStrengthen = new Map(); arm.levelCosts.forEach((cost) => totalStrengthen.set(cost.id, (totalStrengthen.get(cost.id) || 0) + cost.amount)); const gradeRows = arm.gradeByLevel.map((grade) => { const costs = arm.gradeCosts.filter((cost) => cost.grade === grade.level); return `<tr><td class="level-label">${grade.level}级</td><td>${renderAttributes(grade.attributes)}<br><span class="effect-text">${escapeHtml(grade.description)}</span></td><td><div class="material-list">${costs.map((cost) => renderMaterial(cost.id, cost.amount)).join('')}</div></td></tr>`; }).join(''); const card = document.createElement('article'); card.className = 'arm-card'; const armIcon = arm.icon || arm.smallIcon || 'assets/counsellor-items/head_dajishi.png'; card.innerHTML = `<h3><span class="arm-icon"><img src="${escapeHtml(armIcon)}" alt="${escapeHtml(arm.name)}图标" onerror="this.onerror=null;this.src='assets/counsellor-items/head_dajishi.png'"></span>${escapeHtml(arm.name)}</h3><p>强化至 ${arm.maxLevel} 级：${[...totalStrengthen.entries()].map(([id, amount]) => `${escapeHtml(materialInfo(id).name)} ×${fmt(amount)}`).join('、')}</p><div class="attribute-list">${renderAttributes(arm.levelAttributes)}</div><div class="arm-table-wrap"><table class="arm-table"><thead><tr><th>进阶等级</th><th>新增属性 / 效果</th><th>进阶材料</th></tr></thead><tbody>${gradeRows}</tbody></table></div>`; armList.appendChild(card); });
  </script>
</body>
</html>
